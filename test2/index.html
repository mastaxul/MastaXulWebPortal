<!DOCTYPE html>

<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ujian Turnstile | Masta Xul</title>

  <style>

    body {

      font-family: system-ui, sans-serif;

      max-width: 560px;

      margin: 40px auto;

      padding: 20px;

      background: #10131a;

      color: #f3f4f6;

    }

    main {

      padding: 24px;

      border: 1px solid #343a46;

      border-radius: 16px;

      background: #191e28;

    }

    h1 { font-size: 1.5rem; }

    p { line-height: 1.6; color: #c5cad5; }

    button {

      margin-top: 18px;

      padding: 12px 18px;

      border: 0;

      border-radius: 8px;

      background: #8bafff;

      color: #10131a;

      font-weight: 700;

    }

    #result {

      margin-top: 20px;

      overflow-wrap: anywhere;

      white-space: pre-wrap;

    }

  </style>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"

          async defer></script>

</head>

<body>

  <main>

    <h1>Ujian CAPTCHA Masta Xul</h1>

    <p>Halaman ujian sementara. Halaman ini tidak mengubah

       sistem login atau data admin.</p>

    <div id="captcha"></div>

    <button id="verify" disabled>Uji pengesahan</button>

    <p id="result" role="status">Menunggu CAPTCHA...</p>

  </main>

  <script>

    const SITE_KEY = "0x4AAAAAAFWrdcXMTCekaOTS";

    const VERIFY_URL =

      "https://mastaxul-captcha.2ulfpv.workers.dev/verify";

    let captchaToken = "";

    window.addEventListener("load", () => {

      if (!window.turnstile) {

        document.getElementById("result").textContent =

          "CAPTCHA belum dimuatkan. Cuba muat semula halaman.";

        return;

      }

      turnstile.render("#captcha", {

        sitekey: SITE_KEY,

        callback: (token) => {

          captchaToken = token;

          document.getElementById("verify").disabled = false;

          document.getElementById("result").textContent =

            "CAPTCHA selesai. Sedia untuk diuji.";

        },

        "expired-callback": () => {

          captchaToken = "";

          document.getElementById("verify").disabled = true;

          document.getElementById("result").textContent =

            "Token tamat tempoh. Selesaikan CAPTCHA semula.";

        },

        "error-callback": () => {

          document.getElementById("result").textContent =

            "Ralat CAPTCHA. Semak hostname dan Site Key.";

        }

      });

    });

    
document.getElementById("verify").addEventListener("click", async () => {
  const result = document.getElementById("result");
  const button = document.getElementById("verify");
  const token = captchaToken;

  if (!token) return;

  button.disabled = true;
  result.textContent = "Menjalankan ujian keselamatan...";

  async function checkToken(value) {
    const response = await fetch(
      "https://mastaxul-captcha.2ulfpv.workers.dev/verify",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: value })
      }
    );

    return {
      status: response.status,
      data: await response.json()
    };
  }

  try {
    // Ujian 1: token palsu
    const fake = await checkToken("FAKE_INVALID_TURNSTILE_TOKEN");
    const fakePassed =
      fake.data.success === false && fake.status !== 500 &&
      fake.status !== 502;

    // Ujian 2: sahkan token sebenar, kemudian guna semula
    const first = await checkToken(token);
    const replay = await checkToken(token);

    result.textContent =
      "UJIAN TOKEN PALSU: " +
      (fakePassed ? "DITOLAK — LULUS" : "SEMAK — " +
        JSON.stringify(fake)) + "\n\n" +
      "PENGGUNAAN PERTAMA: " +
      (first.data.success ? "DITERIMA" : "GAGAL — " +
        JSON.stringify(first)) + "\n\n" +
      "PENGGUNAAN SEMULA: " +
      (!replay.data.success ? "DITOLAK — LULUS" :
        "DITERIMA — GAGAL UJIAN");

  } catch (error) {
    result.textContent =
      "Ralat rangkaian: " + error.message;
  } finally {
    captchaToken = "";
    if (window.turnstile) turnstile.reset();
    button.disabled = true;
  }
});


      async () => {

        const result = document.getElementById("result");

        const button = document.getElementById("verify");

        if (!captchaToken) return;

        button.disabled = true;

        result.textContent = "Sedang mengesahkan token...";

        try {

          const response = await fetch(VERIFY_URL, {

            method: "POST",

            headers: { "Content-Type": "application/json" },

            body: JSON.stringify({ token: captchaToken })

          });

          const data = await response.json();

          result.textContent = data.success

            ? "BERJAYA: Token CAPTCHA disahkan."

            : "BELUM BERJAYA: " +

              (data.error || "Token tidak sah.");

        } catch {

          result.textContent =

            "Tidak dapat menghubungi Worker. Semak Origin dan sambungan.";

        } finally {

          captchaToken = "";

          if (window.turnstile) turnstile.reset();

          button.disabled = true;

        }

      }

    );

  </script>

</body>

</html>
