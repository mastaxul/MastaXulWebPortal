<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2EC4B6">
<title>Masta Xul: Kenali Haiwan — Animal World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2EC4B6; --teal-d:#1f9e92; --yellow:#FFC94D; --coral:#FF7B54;
  --purple:#7C5CFC; --green:#58CC02; --green-d:#46a302; --red:#FF4B4B;
  --ink:#3c3c3c; --paper:#FFFDF5; --card:#ffffff;
  --shadow:0 4px 0 rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Fredoka','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
  background:linear-gradient(180deg,#B7F0EA 0%,#D9F7D4 55%,#FFF3C9 100%);
  min-height:100vh; color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:760px;margin:0 auto;padding:12px 14px 40px}
button{font-family:inherit;cursor:pointer;border:none;touch-action:manipulation}
button:active{transform:translateY(2px)}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-weight:700;font-size:22px;color:var(--teal-d);letter-spacing:.5px}
.logo span{color:var(--coral)}
.topbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pillbtn{background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);min-height:44px;display:inline-flex;align-items:center;gap:4px}
.pillbtn.on{background:var(--yellow)}
h1.title{text-align:center;font-size:clamp(24px,6vw,38px);margin:14px 0 4px;color:var(--purple)}
.subtitle{text-align:center;font-size:clamp(14px,3.5vw,17px);margin:0 0 18px;color:#666}

/* ---------- Menu ---------- */
.menugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.menugrid{grid-template-columns:repeat(3,1fr)}}
.modecard{background:var(--card);border-radius:20px;padding:18px 12px;text-align:center;
  box-shadow:var(--shadow);min-height:44px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:transform .15s}
.modecard:hover{transform:scale(1.03)}
.modecard .mi{font-size:40px;line-height:1}
.modecard .mn{font-weight:600;font-size:15px}
.modecard .hs{font-size:12px;color:#999}
.diffrow{display:flex;gap:8px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.diffbtn{background:#fff;border-radius:14px;padding:10px 18px;font-weight:600;font-size:15px;
  box-shadow:var(--shadow);min-height:44px;min-width:88px}
.diffbtn.on{background:var(--green);color:#fff}
.scoreline{text-align:center;font-size:14px;color:#777;margin-top:10px}

/* ---------- Game screens ---------- */
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);text-align:center}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hud .hitem{background:#fff;border-radius:12px;padding:6px 14px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.timerbar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:12px}
.timerbar>div{height:100%;background:var(--green);border-radius:99px;transition:width .3s linear}
.animal-emoji{font-size:clamp(90px,26vw,150px);line-height:1.1;margin:8px 0}
.animal-name{font-size:clamp(24px,6vw,34px);font-weight:700;color:var(--teal-d)}
.animal-fact{font-size:15px;color:#666;margin:10px auto 0;max-width:480px;line-height:1.5}
.qtext{font-size:clamp(18px,5vw,24px);font-weight:600;margin-bottom:14px}
.optgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media(min-width:480px){.optgrid{grid-template-columns:1fr 1fr}}
.optbtn{background:#fff;border:3px solid #e5e5e5;border-radius:16px;padding:14px;font-size:17px;font-weight:600;
  min-height:54px;box-shadow:0 3px 0 #e5e5e5}
.optbtn.emoji{font-size:34px;padding:10px}
.optbtn.correct{background:#d7ffb8;border-color:var(--green);color:var(--green-d);animation:pop .35s}
.optbtn.wrong{background:#ffdfe0;border-color:var(--red);color:var(--red);animation:shake .35s}
.optbtn:disabled{opacity:.85;cursor:default}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:28px;font-weight:700;font-size:18px;margin-top:12px}
.feedback.ok{color:var(--green-d)} .feedback.no{color:var(--red)}

/* match mode */
.matchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media(min-width:560px){.matchgrid{gap:10px}}
.mcard{background:var(--purple);border-radius:14px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,7vw,40px);font-weight:700;color:transparent;user-select:none;box-shadow:var(--shadow)}
.mcard.open{background:#fff;color:var(--ink);border:3px solid var(--purple)}
.mcard.name{font-size:clamp(11px,3vw,15px);padding:4px;text-align:center}
.mcard.done{background:#d7ffb8;border-color:var(--green);color:var(--ink);opacity:.9}
.mcard.wrongf{animation:shake .35s}

/* gallery */
.galtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.searchin{flex:1;min-width:160px;padding:12px 14px;border-radius:14px;border:3px solid #e5e5e5;font-size:16px;font-family:inherit;min-height:44px}
.catbtn{background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);min-height:40px}
.catbtn.on{background:var(--teal);color:#fff}
.galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.galgrid{grid-template-columns:repeat(4,1fr)}}
.gcard{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);min-height:44px}
.gcard .ge{font-size:44px}
.gcard .gn{font-size:13px;font-weight:600;margin-top:4px}
.noresult{text-align:center;color:#888;padding:30px 0}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center;max-height:85vh;overflow:auto}
.modal .me{font-size:80px}
.mrow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #eee;padding:8px 4px;font-size:15px}
.mrow b{color:var(--teal-d)}

/* buttons row */
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.bigbtn{border-radius:16px;padding:14px 26px;font-size:17px;font-weight:700;min-height:52px;box-shadow:0 4px 0 rgba(0,0,0,.12);color:#fff}
.bigbtn.teal{background:var(--teal)} .bigbtn.coral{background:var(--coral)}
.bigbtn.purple{background:var(--purple)} .bigbtn.yellow{background:var(--yellow);color:#6b5200}
.bigbtn.grey{background:#aab3ab}
.learnnav{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px}
.learnnav button{border-radius:14px;padding:12px 20px;font-size:18px;font-weight:700;background:var(--yellow);color:#6b5200;min-height:52px;box-shadow:var(--shadow)}
.counter{font-weight:700;color:#777}
.result-emoji{font-size:70px}
.result-score{font-size:40px;font-weight:700;color:var(--purple)}
.newbest{color:var(--green-d);font-weight:700}
.footer{text-align:center;font-size:12px;color:#999;margin-top:26px}
.footer a{color:var(--teal-d)}
</style>
</head>

/* ---------- 100 haiwan: [emoji, kategori, nama_ms, nama_en, nama_zh, fakta_ms, fakta_en, fakta_zh] ---------- */
const A = [
["🐯","mammal","Harimau","Tiger","老虎","Harimau ialah kucing terbesar di dunia dan setiap ekor mempunyai corak belang yang berbeza.","Tigers are the world's biggest cats, and each one has a unique stripe pattern.","老虎是世界上最大的猫科动物，每只老虎的条纹都独一无二。"],
["🦁","mammal","Singa","Lion","狮子","Singa dikenali sebagai raja hutan dan hidup berkumpulan yang dipanggil 'pride'.","Lions are called the king of the jungle and live in groups called prides.","狮子被称为森林之王，成群生活，群体叫狮群。"],
["🐘","mammal","Gajah","Elephant","大象","Gajah ialah haiwan darat terbesar dan belalainya mempunyai lebih 40,000 otot.","Elephants are the largest land animals; their trunks have over 40,000 muscles.","大象是陆地上最大的动物，鼻子有超过四万块肌肉。"],
["🦒","mammal","Zirafah","Giraffe","长颈鹿","Zirafah ialah haiwan tertinggi di dunia dan lidahnya boleh mencecah 45 cm.","Giraffes are the tallest animals; their tongues can reach 45 cm long.","长颈鹿是世界上最高的动物，舌头可长达45厘米。"],
["🐼","mammal","Panda","Panda","大熊猫","Panda makan buluh sehingga 12 jam sehari.","Pandas spend up to 12 hours a day eating bamboo.","大熊猫每天花多达12个小时吃竹子。"],
["🐻","mammal","Beruang","Bear","熊","Beruang tidur sepanjang musim sejuk dalam keadaan yang dipanggil hibernasi.","Bears sleep through winter in a state called hibernation.","熊冬天会冬眠，一睡就是几个月。"],
["🐻‍❄️","mammal","Beruang Kutub","Polar Bear","北极熊","Beruang kutub sebenarnya berkulit hitam di bawah bulu putihnya.","Polar bears actually have black skin under their white fur.","北极熊白色的毛下面其实是黑色的皮肤。"],
["🐴","mammal","Kuda","Horse","马","Kuda boleh tidur sambil berdiri.","Horses can sleep while standing up.","马可以站着睡觉。"],
["🐄","mammal","Lembu","Cow","奶牛","Lembu mempunyai empat bahagian perut untuk menghadam makanan.","Cows have four stomach compartments to digest food.","奶牛有四个胃室来帮助消化食物。"],
["🐐","mammal","Kambing","Goat","山羊","Kambing adalah pemanjat yang hebat dan boleh memanjat cerun curam.","Goats are amazing climbers and can climb steep slopes.","山羊是攀岩高手，能爬上陡峭的山坡。"],
["🐑","mammal","Biri-biri","Sheep","绵羊","Bulu biri-biri dipanggil 'wool' dan digunakan untuk membuat pakaian hangat.","Sheep's fleece is called wool and is used to make warm clothes.","绵羊的毛叫羊毛，可以用来做保暖的衣服。"],
["🦌","mammal","Rusa","Deer","鹿","Rusa jantan menumbuhkan tanduk baharu setiap tahun.","Male deer grow new antlers every year.","雄鹿每年都会长出新的鹿角。"],
["🐒","mammal","Monyet","Monkey","猴子","Monyet suka hidup berkumpulan dan sangat bijak menggunakan alat.","Monkeys live in groups and are clever enough to use tools.","猴子喜欢群居，聪明到会使用工具。"],
["🦍","mammal","Gorila","Gorilla","大猩猩","Gorila ialah primat terbesar dan berkongsi 98% DNA dengan manusia.","Gorillas are the largest primates and share 98% of DNA with humans.","大猩猩是最大的灵长类动物，与人类有98%相同的DNA。"],
["🦧","mammal","Orang Utan","Orangutan","红毛猩猩","Orang utan tinggal di hutan Borneo dan Sumatera serta sangat pandai.","Orangutans live in the forests of Borneo and Sumatra and are very smart.","红毛猩猩生活在婆罗洲和苏门答腊的森林里，非常聪明。"],
["🐰","mammal","Arnab","Rabbit","兔子","Telinga arnab yang panjang membantunya mendengar bahaya dari jauh.","A rabbit's long ears help it hear danger from far away.","兔子的长耳朵能帮助它听到远处的危险。"],
["🐱","mammal","Kucing","Cat","猫","Kucing tidur sehingga 16 jam sehari dan sentiasa jatuh dengan kaki dahulu.","Cats sleep up to 16 hours a day and usually land on their feet.","猫一天可以睡16个小时，而且常常能四脚着地。"],
["🐶","mammal","Anjing","Dog","狗","Hidung anjing 40 kali lebih sensitif daripada hidung manusia.","A dog's nose is about 40 times more sensitive than a human's.","狗的鼻子比人的鼻子灵敏约40倍。"],
["🦊","mammal","Musang","Fox","狐狸","Musang menggunakan ekornya yang lebat sebagai selimut ketika tidur.","Foxes use their bushy tails as blankets when they sleep.","狐狸睡觉时会用蓬松的尾巴当被子。"],
["🐺","mammal","Serigala","Wolf","狼","Serigala berkomunikasi dengan lolongan yang boleh didengar sejauh 10 km.","Wolves howl to communicate; their howls can be heard 10 km away.","狼用嚎叫交流，嚎声可以传到10公里外。"],
["🦘","mammal","Kanggaru","Kangaroo","袋鼠","Anak kanggaru tinggal dalam kantung ibunya yang dipanggil 'pouch'.","Baby kangaroos live in their mother's pouch.","袋鼠宝宝住在妈妈的育儿袋里。"],
["🦓","mammal","Zebra","Zebra","斑马","Setiap zebra mempunyai corak belang yang unik seperti cap jari.","Every zebra has a unique stripe pattern, like a fingerprint.","每匹斑马的条纹都像指纹一样独一无二。"],
["🦏","mammal","Badak Sumbu","Rhinoceros","犀牛","Sumbu badak diperbuat daripada keratin, bahan yang sama seperti kuku manusia.","A rhino's horn is made of keratin, the same material as human nails.","犀牛的角由角蛋白构成，和人的指甲是同一种物质。"],
["🦛","mammal","Kuda Nil","Hippopotamus","河马","Kuda nil suka berada di dalam air tetapi tidak pandai berenang — ia berjalan di dasar sungai.","Hippos love water but can't swim — they walk along river bottoms.","河马喜欢泡在水里，但不会游泳，而是在河底行走。"],
["🐪","mammal","Unta","Camel","骆驼","Unta boleh minum 100 liter air dalam masa 10 minit.","A camel can drink 100 litres of water in 10 minutes.","骆驼能在10分钟内喝下100升水。"],
["🐷","mammal","Babi","Pig","猪","Babi sebenarnya haiwan yang bersih dan sangat bijak.","Pigs are actually clean and very intelligent animals.","猪其实是爱干净而且非常聪明的动物。"],
["🐿️","mammal","Tupai","Squirrel","松鼠","Tupai menanam ribuan pokok secara tidak sengaja kerana lupa tempat menyorok biji.","Squirrels plant thousands of trees by forgetting where they buried nuts.","松鼠因为忘记藏坚果的地方，无意间种下了成千上万棵树。"],
["🦔","mammal","Landak","Hedgehog","刺猬","Landak mempunyai sehingga 6,000 duri di badannya.","A hedgehog can have up to 6,000 spines on its body.","刺猬身上可以有多达6000根刺。"],
["🦇","mammal","Kelawar","Bat","蝙蝠","Kelawar ialah satu-satunya mamalia yang boleh terbang.","Bats are the only mammals that can truly fly.","蝙蝠是唯一真正会飞的哺乳动物。"],
["🐭","mammal","Tikus","Mouse","老鼠","Gigi tikus tidak pernah berhenti tumbuh sepanjang hayatnya.","A mouse's teeth never stop growing throughout its life.","老鼠的牙齿一生都在不停地生长。"],
["🐨","mammal","Koala","Koala","考拉","Koala tidur sehingga 22 jam sehari dan makan daun eukaliptus.","Koalas sleep up to 22 hours a day and eat eucalyptus leaves.","考拉一天可以睡22个小时，以桉树叶为食。"],
["🦥","mammal","Kungkang","Sloth","树懒","Kungkang sangat perlahan sehingga alga boleh tumbuh pada bulunya.","Sloths are so slow that algae can grow on their fur.","树懒行动慢到毛发上都能长出藻类。"],
["🦙","mammal","Llama","Llama","羊驼","Llama meludah apabila marah atau terancam.","Llamas spit when they are annoyed or feel threatened.","羊驼生气或受到威胁时会吐口水。"],
["🦨","mammal","Sigung","Skunk","臭鼬","Sigung menyembur cecair berbau busuk untuk melindungi diri.","Skunks spray a stinky liquid to protect themselves.","臭鼬会喷出难闻的液体来保护自己。"],
["🦫","mammal","Biver","Beaver","海狸","Biver membina empangan daripada kayu dan sangat rajin bekerja.","Beavers build dams from wood and are very hardworking.","海狸会用木头筑坝，非常勤劳。"],
["🐹","mammal","Hamster","Hamster","仓鼠","Hamster menyimpan makanan di dalam pipinya.","Hamsters store food in their cheek pouches.","仓鼠会把食物藏在腮帮子里。"],
["🦣","mammal","Mamut","Mammoth","猛犸象","Mamut ialah gajah purba berbulu panjang yang telah pupus.","Mammoths were long-haired ancient elephants that are now extinct.","猛犸象是长着长毛的古代大象，如今已经灭绝。"],
["🐗","mammal","Babi Hutan","Wild Boar","野猪","Babi hutan menggunakan hidungnya untuk mencari makanan di dalam tanah.","Wild boars use their snouts to dig for food in the ground.","野猪用鼻子在土里拱食。"],

/* ---------- State & simpanan setempat ---------- */
let S = {lang:'ms', sound:true, diff:'easy', best:{}};
try{const s=JSON.parse(localStorage.getItem('mastaxul_save')); if(s) S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem('mastaxul_save',JSON.stringify(S));}catch(e){}}
const T=()=>I18N[S.lang];
const app=document.getElementById('app');

/* ---------- Utiliti ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sampleWrong=(idx,n)=>{const p=new Set();while(p.size<n){const r=Math.floor(Math.random()*A.length);if(r!==idx)p.add(r);}return [...p];};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Bunyi (WebAudio, tiada fail luar) ---------- */
let AC=null;
function tone(f,d,type='sine',t=0){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.18,AC.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+d);
    o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+d);
  }catch(e){}
}
const sndOK=()=>{tone(523,.15);tone(784,.25,'sine',.12);};
const sndNO=()=>{tone(220,.3,'square');};

/* ---------- Sebutan ---------- */
function speak(text){
  if(!('speechSynthesis' in window)||!S.sound)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=SPEECH_LANG[S.lang];u.rate=.85;
  speechSynthesis.speak(u);
}

/* ---------- Rangka atas (logo, bahasa, bunyi) ---------- */
function header(){
  const L=S.lang;
  return `<div class="top">
    <div class="logo">Masta <span>Xul</span></div>
    <div class="topbtns">
      <button class="pillbtn ${L==='ms'?'on':''}" onclick="setLang('ms')">BM</button>
      <button class="pillbtn ${L==='en'?'on':''}" onclick="setLang('en')">EN</button>
      <button class="pillbtn ${L==='zh'?'on':''}" onclick="setLang('zh')">中文</button>
      <button class="pillbtn" onclick="toggleSound()">${S.sound?'🔊':'🔇'}</button>
    </div></div>`;
}
function setLang(l){S.lang=l;save();go(currentScreen,true);}
function toggleSound(){S.sound=!S.sound;save();go(currentScreen,true);}
const footerHTML=()=>`<div class="footer">Masta Xul: Kenali Haiwan — Animal World · <a href="https://www.mastaxul.my" target="_blank" rel="noopener">mastaxul.my</a></div>`;

/* ---------- Penghala skrin ---------- */
let currentScreen='menu', cleanup=null;
function go(screen,keep){
  if(typeof cleanup==='function'){cleanup();cleanup=null;}
  currentScreen=screen;
  ({menu:renderMenu,learn:renderLearn,quiz:()=>renderQuiz('quiz'),
    find:()=>renderQuiz('find'),match:renderMatch,time:renderTime,gallery:renderGallery}[screen])();
  window.scrollTo(0,0);
}

/* ---------- Menu utama ---------- */
function renderMenu(){
  const t=T();
  const modes=[
    ['learn','🦁'],['quiz','❓'],['find','🔎'],['match','🧩'],['time','⏱️'],['gallery','🖼️']
  ];
  app.innerHTML=header()+`
    <h1 class="title">${t.title}</h1><p class="subtitle">${t.subtitle}</p>
    <div class="diffrow"><b style="width:100%;text-align:center">${t.difficulty}:</b>
      ${['easy','medium','hard'].map(d=>`<button class="diffbtn ${S.diff===d?'on':''}" onclick="setDiff('${d}')">${t.diff[d]}</button>`).join('')}
    </div>
    <div class="menugrid">
      ${modes.map(([m,ic])=>`<button class="modecard" onclick="go('${m}')">
        <div class="mi">${ic}</div><div class="mn">${t.modes[m]}</div>
        <div class="hs">${t.best}: ${S.best[m+'_'+S.diff]||S.best[m]||0}</div></button>`).join('')}
    </div>`+footerHTML();
}
function setDiff(d){S.diff=d;save();renderMenu();}

/* ---------- MOD A: Kenali Haiwan ---------- */
let learnIdx=0;
function renderLearn(){
  const t=T();
  const a=A[learnIdx];
  const name=S.lang==='ms'?a[2]:S.lang==='en'?a[3]:a[4];
  const fact=S.lang==='ms'?a[5]:S.lang==='en'?a[6]:a[7];
  app.innerHTML=header()+`
    <div class="hud"><button class="pillbtn" onclick="go('menu')">← ${t.menu}</button>
      <div class="hitem">${t.modes.learn}</div>
      <button class="pillbtn" onclick="speak('${esc(name).replace(/'/g,"\\'")}')">🔊 ${t.listen}</button></div>
    <div class="card">
      <div class="animal-emoji">${a[0]}</div>
      <div class="animal-name">${esc(name)}</div>
      <div class="animal-fact"><b>${t.habitat}:</b> ${esc(fact)}</div>
      <div class="learnnav">
        <button onclick="learnStep(-1)">◀</button>
        <span class="counter">${learnIdx+1} / ${A.length}</span>
        <button onclick="learnStep(1)">▶</button>
      </div>
    </div>`+footerHTML();
  speak(name);
}
function learnStep(d){learnIdx=(learnIdx+d+A.length)%A.length;renderLearn();}

/* ---------- MOD B & C: Kuiz & Cari Nama ---------- */
let G=null; // {mode,list,q,score,ans,timerId}
function qCount(){return S.diff==='easy'?5:S.diff==='medium'?10:15;}
function nOpt(){return S.diff==='hard'?6:4;}
function renderQuiz(mode){
  const t=T();
  G={mode,list:shuffle(A.map((_,i)=>i)).slice(0,qCount()),q:0,score:0,ans:false};
  drawQuestion();
}
function drawQuestion(){
  const t=T(), i=G.list[G.q], a=A[i];
  const wrong=sampleWrong(i,nOpt()-1), opts=shuffle([i,...wrong]);
  const isQuiz=G.mode==='quiz';
  const askName=S.lang==='ms'?a[2]:S.lang==='en'?a[3]:a[4];
  app.innerHTML=header()+`
    <div class="hud"><button class="pillbtn" onclick="endQuiz(true)">⏹ ${t.stop}</button>
      <div class="hitem">${t.question} ${G.q+1}/${G.list.length}</div>
      <div class="hitem">⭐ ${t.score}: ${G.score}</div></div>
    <div class="card">
      ${isQuiz
        ?`<div class="qtext">${t.qWhich}</div><div class="animal-emoji">${a[0]}</div>`
        :`<div class="qtext">${t.qFind} <b style="color:var(--purple)">${esc(askName)}</b></div>`}
      <div class="optgrid">
        ${opts.map(o=>isQuiz
          ?`<button class="optbtn" onclick="answer(${o},${i},this)">${esc(S.lang==='ms'?A[o][2]:S.lang==='en'?A[o][3]:A[o][4])}</button>`
          :`<button class="optbtn emoji" onclick="answer(${o},${i},this)">${A[o][0]}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    </div>`+footerHTML();
}
function answer(pick,real,btn){
  if(G.ans)return; G.ans=true;
  const t=T(), ok=pick===real;
  document.querySelectorAll('.optbtn').forEach(b=>{
    b.disabled=true;
    if(b===btn)b.classList.add(ok?'correct':'wrong');
  });
  if(!ok){ // tunjuk jawapan betul
    document.querySelectorAll('.optbtn').forEach(b=>{
      const idx=+b.getAttribute('onclick').match(/answer\((\d+)/)[1];
      if(idx===real)b.classList.add('correct');
    });
  }
  ok?(G.score++,sndOK()):sndNO();
  const realName=S.lang==='ms'?A[real][2]:S.lang==='en'?A[real][3]:A[real][4];
  document.getElementById('fb').innerHTML=
    ok?`<span class="ok">${t.correct}</span>`:`<span class="no">${t.wrong} ${t.correctAns} ${esc(realName)}</span>`;
  document.querySelector('.hud .hitem:last-child').textContent=`⭐ ${t.score}: ${G.score}`;
  setTimeout(()=>{G.q++;G.ans=false;G.q<G.list.length?drawQuestion():endQuiz();},ok?900:1800);
}
function endQuiz(stopped){
  const t=T(), key=G.mode+'_'+S.diff, total=G.list.length;
  const isBest=G.score>(S.best[key]||0);
  if(isBest){S.best[key]=G.score;save();}
  app.innerHTML=header()+`
    <div class="card">
      <div class="result-emoji">${G.score===total?'🏆':G.score>=total/2?'🎉':'💪'}</div>
      <h2>${stopped?t.gameOver:t.great}</h2>
      <div class="result-score">${G.score} / ${total}</div>
      ${isBest&&G.score>0?`<p class="newbest">🌟 ${t.newBest}</p>`:''}
      <p>${t.best}: ${S.best[key]||0}</p>
      <div class="btnrow">
        <button class="bigbtn teal" onclick="renderQuiz('${G.mode}')">🔁 ${t.restart}</button>
        <button class="bigbtn grey" onclick="go('menu')">🏠 ${t.menu}</button>
      </div>
    </div>`+footerHTML();
  G=null;
}

/* ---------- MOD D: Padankan Haiwan ---------- */
function pairCount(){return S.diff==='easy'?3:S.diff==='medium'?4:6;}
function renderMatch(){
  const t=T();
  const picks=shuffle(A.map((_,i)=>i)).slice(0,pairCount());
  let cards=[];
  picks.forEach(i=>{cards.push({i,type:'emoji'});cards.push({i,type:'name'});});
  cards=shuffle(cards);
  let open=null, done=0, moves=0, lock=false;
  app.innerHTML=header()+`
    <div class="hud"><button class="pillbtn" onclick="go('menu')">← ${t.menu}</button>
      <div class="hitem">${t.pairsLeft}: <span id="pairs">${picks.length}</span></div>
      <div class="hitem">${t.moves}: <span id="moves">0</span></div></div>
    <div class="card">
      <div class="qtext">${t.tapMatch}</div>
      <div class="matchgrid" id="mg">
        ${cards.map((c,ci)=>`<button class="mcard ${c.type==='name'?'name':''}" data-i="${c.i}" data-t="${c.type}" data-ci="${ci}">?</button>`).join('')}
      </div>
    </div>`+footerHTML();
  const grid=document.getElementById('mg');
  grid.addEventListener('click',e=>{
    const b=e.target.closest('.mcard');
    if(!b||lock||b.classList.contains('open')||b.classList.contains('done'))return;
    b.classList.add('open');
    const i=+b.dataset.i;
    b.textContent=b.dataset.t==='emoji'?A[i][0]:(S.lang==='ms'?A[i][2]:S.lang==='en'?A[i][3]:A[i][4]);
    if(!open){open=b;return;}
    moves++;document.getElementById('moves').textContent=moves;
    if(open.dataset.i===b.dataset.i&&open.dataset.t!==b.dataset.t){
      open.classList.add('done');b.classList.add('done');open=null;
      done++;document.getElementById('pairs').textContent=picks.length-done;sndOK();
      if(done===picks.length){
        const key='match_'+S.diff, isBest=!(S.best[key])||moves<S.best[key];
        if(isBest){S.best[key]=moves;save();}
        setTimeout(()=>{
          app.innerHTML=header()+`<div class="card">
            <div class="result-emoji">🧩🎉</div><h2>${t.wellDone}</h2>
            <div class="result-score">${moves} ${t.moves}</div>
            ${isBest?`<p class="newbest">🌟 ${t.newBest}</p>`:''}
            <p>${t.best}: ${S.best[key]}</p>
            <div class="btnrow">
              <button class="bigbtn teal" onclick="renderMatch()">🔁 ${t.restart}</button>
              <button class="bigbtn grey" onclick="go('menu')">🏠 ${t.menu}</button>
            </div></div>`+footerHTML();
        },600);
      }
    }else{
      const o=open;lock=true;sndNO();open=null;
      o.classList.add('wrongf');b.classList.add('wrongf');
      setTimeout(()=>{[o,b].forEach(x=>{x.classList.remove('open','wrongf');x.textContent='?';});lock=false;},800);
    }
  });
}

/* ---------- MOD E: Cabaran Masa ---------- */
function timeLimit(){return S.diff==='easy'?60:S.diff==='medium'?45:30;}
function renderTime(){
  const t=T();
  G={mode:'time',q:0,score:0,ans:false,left:timeLimit()};
  app.innerHTML=header()+`
    <div class="hud"><button class="pillbtn" onclick="endTime()">⏹ ${t.stop}</button>
      <div class="hitem">⏱️ <span id="tleft">${G.left}</span>s</div>
      <div class="hitem">⭐ ${t.score}: <span id="tscore">0</span></div></div>
    <div class="timerbar"><div id="tbar" style="width:100%"></div></div>
    <div class="card" id="qcard"></div>`+footerHTML();
  drawTimeQ();
  const total=G.left;
  G.timerId=setInterval(()=>{
    G.left--;
    const el=document.getElementById('tleft'),bar=document.getElementById('tbar');
    if(el){el.textContent=G.left;bar.style.width=(G.left/total*100)+'%';
      bar.style.background=G.left<=10?'var(--red)':G.left<=total/2?'var(--yellow)':'var(--green)';}
    if(G.left<=0)endTime();
  },1000);
  cleanup=()=>{if(G&&G.timerId){clearInterval(G.timerId);G.timerId=null;}};
}
function drawTimeQ(){
  if(!G||G.mode!=='time')return;
  const t=T();
  const i=Math.floor(Math.random()*A.length), a=A[i];
  const opts=shuffle([i,...sampleWrong(i,nOpt()-1)]);
  document.getElementById('qcard').innerHTML=`
    <div class="qtext">${t.qWhich}</div><div class="animal-emoji">${a[0]}</div>
    <div class="optgrid">${opts.map(o=>`<button class="optbtn" onclick="timeAnswer(${o},${i},this)">
      ${esc(S.lang==='ms'?A[o][2]:S.lang==='en'?A[o][3]:A[o][4])}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>`;
}
function timeAnswer(pick,real,btn){
  if(G.ans)return;G.ans=true;
  const t=T(),ok=pick===real;
  document.querySelectorAll('#qcard .optbtn').forEach(b=>b.disabled=true);
  btn.classList.add(ok?'correct':'wrong');
  if(ok){G.score++;document.getElementById('tscore').textContent=G.score;sndOK();
    document.getElementById('fb').innerHTML=`<span class="ok">${t.correct}</span>`;}
  else{sndNO();
    document.getElementById('fb').innerHTML=`<span class="no">${t.wrong}</span>`;}
  setTimeout(()=>{if(G&&G.timerId){G.ans=false;drawTimeQ();}},700);
}
function endTime(){
  if(!G)return;
  if(G.timerId){clearInterval(G.timerId);G.timerId=null;}
  const t=T(),key='time_'+S.diff,isBest=G.score>(S.best[key]||0);
  if(isBest){S.best[key]=G.score;save();}
  app.innerHTML=header()+`<div class="card">
    <div class="result-emoji">⏱️🏁</div><h2>${t.gameOver}</h2>
    <div class="result-score">${G.score}</div>
    ${isBest&&G.score>0?`<p class="newbest">🌟 ${t.newBest}</p>`:''}
    <p>${t.best}: ${S.best[key]||0}</p>
    <div class="btnrow">
      <button class="bigbtn teal" onclick="renderTime()">🔁 ${t.restart}</button>
      <button class="bigbtn grey" onclick="go('menu')">🏠 ${t.menu}</button>
    </div></div>`+footerHTML();
  G=null;
}

/* ---------- MOD F: Koleksi Haiwan ---------- */
let galCat='all', galQ='';
function renderGallery(){
  const t=T(),cats=['all','mammal','bird','reptile','water','insect'];
  const catName=c=>c==='all'?t.all:t.cats[c];
  const list=A.map((a,i)=>({a,i})).filter(({a})=>{
    if(galCat!=='all'&&a[1]!==galCat)return false;
    const q=galQ.toLowerCase();
    return !q||a[2].toLowerCase().includes(q)||a[3].toLowerCase().includes(q)||a[4].includes(q);
  });
  app.innerHTML=header()+`
    <div class="hud"><button class="pillbtn" onclick="go('menu')">← ${t.menu}</button>
      <div class="hitem">🖼️ ${t.modes.gallery} (${list.length})</div></div>
    <div class="galtools">
      <input class="searchin" placeholder="${t.search}" value="${esc(galQ)}" oninput="galSearch(this.value)">
      ${cats.map(c=>`<button class="catbtn ${galCat===c?'on':''}" onclick="galFilter('${c}')">${catName(c)}</button>`).join('')}
    </div>
    ${list.length?`<div class="galgrid">${list.map(({a,i})=>`
      <button class="gcard" onclick="showAnimal(${i})">
        <div class="ge">${a[0]}</div><div class="gn">${esc(S.lang==='ms'?a[2]:S.lang==='en'?a[3]:a[4])}</div>
      </button>`).join('')}</div>`
    :`<div class="noresult">😢 ${t.notFound}</div>`}`+footerHTML();
  const inp=document.querySelector('.searchin');
  if(inp&&galQ){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
}
function galFilter(c){galCat=c;renderGallery();}
function galSearch(q){galQ=q;renderGallery();}
function showAnimal(i){
  const a=A[i],t=T();
  document.getElementById('modalroot').innerHTML=`
    <div class="modalbg" onclick="closeModal(event)"><div class="modal">
      <div class="me">${a[0]}</div>
      <div class="mrow"><span>🇲🇾 Bahasa Melayu</span><b>${esc(a[2])}</b></div>
      <div class="mrow"><span>🇬🇧 English</span><b>${esc(a[3])}</b></div>
      <div class="mrow"><span>🇨🇳 中文</span><b>${esc(a[4])}</b></div>
      <div class="mrow"><span>📂</span><b>${t.cats[a[1]]}</b></div>
      <p class="animal-fact" style="text-align:left"><b>${t.habitat}:</b> ${esc(S.lang==='ms'?a[5]:S.lang==='en'?a[6]:a[7])}</p>
      <div class="btnrow">
        <button class="bigbtn purple" onclick="speak('${esc(S.lang==='ms'?a[2]:S.lang==='en'?a[3]:a[4]).replace(/'/g,"\\'")}')">🔊 ${t.listen}</button>
        <button class="bigbtn grey" onclick="document.getElementById('modalroot').innerHTML=''">✕</button>
      </div>
    </div></div>`;
}
function closeModal(e){if(e.target.classList.contains('modalbg'))document.getElementById('modalroot').innerHTML='';}

/* ---------- Mula ---------- */
renderMenu();
</script>
