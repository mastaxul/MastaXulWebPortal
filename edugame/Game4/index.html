<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masta Xul: Kenali Haiwan — Animal World</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2F3640;
            --light: #F7F1E3;
            --white: #FFFFFF;
            --success: #2ED573;
            --danger: #FF4757;
            --shadow: 0 8px 20px rgba(0,0,0,0.15);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #74b9ff 0%, #a29bfe 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 92vh;
            max-height: 850px;
            background: var(--light);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 5px solid var(--white);
        }

        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            display: none;
            position: relative;
        }

        .screen.active {
            display: flex;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-select {
            padding: 5px 10px;
            border-radius: 10px;
            border: 2px solid var(--secondary);
            background: var(--white);
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .home-hero {
            text-align: center;
            margin: 10px 0;
        }

        .home-hero h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 5px;
            font-weight: 800;
        }

        .home-hero p {
            font-size: 0.95rem;
            color: #57606f;
        }

        .mascot-container {
            width: 140px;
            height: 140px;
            margin: 10px auto;
            background: var(--accent);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow);
            animation: bounce 2s infinite ease-in-out;
            overflow: hidden;
            border: 4px solid var(--white);
        }

        .mascot-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .menu-btn {
            background: var(--white);
            border: none;
            padding: 15px 10px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--dark);
            text-align: center;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-icon-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 10px;
        }

        .game-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .back-btn, .audio-toggle-btn {
            background: var(--white);
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: var(--primary);
        }

        .score-board {
            background: var(--accent);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .card-container {
            background: var(--white);
            border-radius: var(--radius);
            padding: 15px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            flex: 1;
            justify-content: center;
            position: relative;
        }

        /* PERBESARAN GAMBAR & BENTUK EMPAT SEGI (RECTANGLE) */
        .animal-img-wrap {
            width: 100%;
            max-width: 260px;
            height: 200px;
            border-radius: 15px;
            overflow: hidden;
            background: #dfe4ea;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border: 4px solid var(--secondary);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .animal-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .animal-title-display {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 5px;
            text-align: center;
        }

        .animal-desc {
            font-size: 0.85rem;
            color: #57606f;
            text-align: center;
            padding: 0 10px;
            line-height: 1.4;
            max-height: 70px;
            overflow-y: auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-bottom: 10px;
        }

        .option-btn {
            background: var(--white);
            border: 3px solid #dfe4ea;
            padding: 12px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        .option-btn:hover {
            border-color: var(--secondary);
        }

        .option-btn.correct {
            background: var(--success) !important;
            color: var(--white);
            border-color: var(--success);
        }

        .option-btn.wrong {
            background: var(--danger) !important;
            color: var(--white);
            border-color: var(--danger);
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .action-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            flex: 1;
            text-align: center;
        }

        .action-btn.secondary {
            background: var(--secondary);
        }

        .gallery-header {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-filter-row {
            display: flex;
            gap: 8px;
        }

        .search-input, .category-select {
            padding: 10px 12px;
            border-radius: 12px;
            border: 2px solid #dfe4ea;
            font-size: 0.85rem;
            outline: none;
            background: var(--white);
        }

        .search-input {
            flex: 1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .gallery-card {
            background: var(--white);
            border-radius: 15px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .gallery-card:active {
            transform: scale(0.97);
        }

        /* GALERI SEGI EMPAT */
        .gallery-card img {
            width: 100%;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 8px;
            background: #f1f2f6;
        }

        .gallery-card h4 {
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .gallery-card span {
            font-size: 0.75rem;
            color: #718093;
        }

        .match-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-item {
            background: var(--white);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
            border: 3px solid #dfe4ea;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-item.selected {
            border-color: var(--primary);
            background: #ffeaa7;
        }

        .match-item.matched {
            background: var(--success);
            color: var(--white);
            border-color: var(--success);
            opacity: 0.7;
            pointer-events: none;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-content {
            background: var(--white);
            padding: 25px;
            border-radius: var(--radius);
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .modal-content p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #57606f;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- SCREEN 1: HOME -->
        <div id="screen-home" class="screen active">
            <div class="app-header">
                <div class="brand-title">Masta Xul</div>
                <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="ms">Bahasa Melayu</option>
                    <option value="en">English</option>
                    <option value="zh">中文 (简体)</option>
                </select>
            </div>

            <div class="home-hero">
                <h1 id="txt-hero-title">Jom Kenali Dunia Haiwan!</h1>
                <p id="txt-hero-sub">Pilih mod permainan dan mula belajar dengan menyeronokkan.</p>
                <div class="mascot-container">
                    <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=400" alt="Mascot Lion">
                </div>
            </div>

            <div class="menu-grid">
                <button class="menu-btn" onclick="startGameMode('explore')">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=100" alt="Icon">
                    <span id="btn-explore">Kenali Haiwan</span>
                </button>
                <button class="menu-btn" onclick="startGameMode('quiz')">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=100" alt="Icon">
                    <span id="btn-quiz">Kuiz Pilihan</span>
                </button>
                <button class="menu-btn" onclick="startGameMode('findName')">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=100" alt="Icon">
                    <span id="btn-findName">Cari Nama</span>
                </button>
                <button class="menu-btn" onclick="startGameMode('match')">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=100" alt="Icon">
                    <span id="btn-match">Padankan Haiwan</span>
                </button>
                <button class="menu-btn" onclick="startGameMode('timeAttack')">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=100" alt="Icon">
                    <span id="btn-time">Cabaran Masa</span>
                </button>
                <button class="menu-btn" onclick="openGallery()">
                    <img class="menu-icon-img" src="https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=100" alt="Icon">
                    <span id="btn-gallery">Koleksi Haiwan</span>
                </button>
            </div>
        </div>

        <!-- SCREEN 2: EXPLORE (KENALI HAIWAN) -->
        <div id="screen-explore" class="screen">
            <div class="game-top-bar">
                <button class="back-btn" onclick="goHome()">UTAMA</button>
                <div class="score-board"><span id="exp-counter">1 / 100</span></div>
                <button class="audio-toggle-btn" id="audioToggleBtn" onclick="toggleAudio()">AUDIO</button>
            </div>

            <div class="card-container">
                <div class="animal-img-wrap">
                    <img id="exp-img" src="" alt="Animal">
                </div>
                <h2 class="animal-title-display" id="exp-name">Nama Haiwan</h2>
                <p class="animal-desc" id="exp-fact">Fakta menarik haiwan akan dipaparkan di sini.</p>
            </div>

            <div class="nav-controls">
                <button class="action-btn secondary" onclick="prevExploreAnimal()" id="btn-prev">Sebelumnya</button>
                <button class="action-btn" onclick="nextExploreAnimal()" id="btn-next">Seterusnya</button>
            </div>
        </div>

        <!-- SCREEN 3: QUIZ & FIND NAME -->
        <div id="screen-game" class="screen">
            <div class="game-top-bar">
                <button class="back-btn" onclick="goHome()">UTAMA</button>
                <div class="score-board"><span id="game-score-lbl">Markah: 0</span></div>
                <div class="score-board" id="game-timer-box" style="display:none;">MASA: <span id="game-timer">30</span>s</div>
            </div>

            <div class="card-container" id="game-visual-container">
                <!-- Dinamik -->
            </div>

            <div class="options-grid" id="game-options-grid">
                <!-- Pilihan -->
            </div>
        </div>

        <!-- SCREEN 4: MATCH GAME -->
        <div id="screen-match" class="screen">
            <div class="game-top-bar">
                <button class="back-btn" onclick="goHome()">UTAMA</button>
                <div class="score-board" id="match-score-lbl">Padanan: 0 / 4</div>
            </div>

            <div class="match-grid-container" id="match-grid">
                <!-- Pasangan -->
            </div>

            <button class="action-btn" onclick="initMatchGame()" id="match-retry-btn">Muat Semula Padanan</button>
        </div>

        <!-- SCREEN 5: GALLERY -->
        <div id="screen-gallery" class="screen">
            <div class="game-top-bar">
                <button class="back-btn" onclick="goHome()">UTAMA</button>
                <div class="brand-title">Koleksi Haiwan</div>
                <div style="width: 40px;"></div>
            </div>

            <div class="gallery-header">
                <div class="search-filter-row">
                    <input type="text" id="gallerySearch" class="search-input" placeholder="Cari haiwan..." oninput="filterGallery()">
                    <select id="galleryCategory" class="category-select" onchange="filterGallery()">
                        <option value="all">Semua</option>
                        <option value="mamalia">Mamalia</option>
                        <option value="burung">Burung</option>
                        <option value="reptilia">Reptilia/Amfibia</option>
                        <option value="air">Hidupan Air</option>
                        <option value="lain">Lain-lain</option>
                    </select>
                </div>
            </div>

            <div class="gallery-grid" id="galleryGrid">
                <!-- Galeri -->
            </div>
        </div>

        <!-- MODAL -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <h2 id="modalTitle">Tahniah!</h2>
                <p id="modalDesc">Permohonan berjaya diselesaikan.</p>
                <button class="action-btn" onclick="closeModal()">Teruskan</button>
            </div>
        </div>
    </div>

    <script>
        // --- 100 ANIMAL DATABASE DENGAN URL GAMBAR YANG TEPAT & DISAHKAN ---
        const animalsData = [
            { id: 1, category: "mamalia", name: { ms: "Harimau", en: "Tiger", zh: "老虎" }, fact: { ms: "Harimau adalah kucing terbesar di dunia.", en: "Tigers are the largest cat species in the world.", zh: "老虎是世界上最大的猫科动物。" }, img: "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=500" },
            { id: 2, category: "mamalia", name: { ms: "Singa", en: "Lion", zh: "狮子" }, fact: { ms: "Singa dikenali sebagai raja rimba.", en: "Lions are known as the king of the jungle.", zh: "狮子被称为森林之王。" }, img: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=500" },
            { id: 3, category: "mamalia", name: { ms: "Gajah", en: "Elephant", zh: "大象" }, fact: { ms: "Gajah mempunyai belalai panjang dan ingatan yang kuat.", en: "Elephants have long trunks and excellent memories.", zh: "大象有着长鼻和极好的记忆力。" }, img: "https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=500" },
            { id: 4, category: "mamalia", name: { ms: "Zirafah", en: "Giraffe", zh: "长颈鹿" }, fact: { ms: "Zirafah adalah haiwan darat tertinggi di dunia.", en: "Giraffes are the tallest land animals on Earth.", zh: "长颈鹿是地球上最高的陆生动物。" }, img: "https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=500" },
            { id: 5, category: "mamalia", name: { ms: "Panda", en: "Panda", zh: "大熊猫" }, fact: { ms: "Panda menghabiskan sebahagian besar masa untuk makan buluh.", en: "Pandas spend most of their day eating bamboo.", zh: "大猫熊花大部分时间吃竹子。" }, img: "https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=500" },

            { id: 7, category: "mamalia", name: { ms: "Kuda", en: "Horse", zh: "马" }, fact: { ms: "Kuda boleh tidur secara berdiri.", en: "Horses are capable of sleeping while standing up.", zh: "马能够站着睡觉。" }, img: "https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=500" },

            { id: 9, category: "mamalia", name: { ms: "Kambing", en: "Goat", zh: "山羊" }, fact: { ms: "Kambing sangat lincah memanjat kawasan curam.", en: "Goats are exceptionally agile climbers on steep terrain.", zh: "山羊是极其敏捷的攀爬者。" }, img: "https://images.unsplash.com/photo-1533514601397-58925dd44e9e?w=500" },
            { id: 10, category: "mamalia", name: { ms: "Biri-biri", en: "Sheep", zh: "绵羊" }, fact: { ms: "Biri-biri menghasilkan bulu yang diproses menjadi pakaian.", en: "Sheep produce wool that is processed into clothing.", zh: "绵羊产出的羊毛可加工成衣物。" }, img: "https://images.unsplash.com/photo-1484557077808-b5350cc4cb89?w=500" },

            { id: 12, category: "mamalia", name: { ms: "Monyet", en: "Monkey", zh: "猴子" }, fact: { ms: "Monyet menggunakan ekor untuk keseimbangan semasa melompat.", en: "Monkeys use their tails for balance while leaping.", zh: "猴子在跳跃时利用尾巴保持平衡。" }, img: "https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?w=500" },

        let currentLang = localStorage.getItem('masta_xul_lang') || 'ms';

        let currentQuestion = null;

        let audioEnabled = true;

        function playSound(type) {
            if (!audioEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(150, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {
                console.log("Audio not supported", e);
            }
        }

            audioEnabled = !audioEnabled;
            document.getElementById('audioToggleBtn').innerText = audioEnabled ? 'AUDIO' : 'SENYAP';

            currentLang = lang;
            localStorage.setItem('masta_xul_lang', lang);
            document.getElementById('langSelect').value = lang;
            
            document.getElementById('txt-hero-title').innerText = uiText[lang].heroTitle;

        function switchScreen(screenId) {
            playSound('click');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(timerInterval) clearInterval(timerInterval);
        }

        function goHome() {
            switchScreen('screen-home');
        }

        function startGameMode(mode) {
            if (mode === 'explore') {
                currentExploreIndex = 0;
                switchScreen('screen-explore');
                renderExploreAnimal();
            } else if (mode === 'quiz' || mode === 'findName' || mode === 'timeAttack') {
                gameActiveMode = mode;
                gameScore = 0;
                switchScreen('screen-game');
                
                if (mode === 'timeAttack') {
                    timeLeft = 30;
                    document.getElementById('game-timer-box').style.display = 'block';
                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('game-timer').innerText = timeLeft;
                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            showModal(uiText[currentLang].gameOver, `${uiText[currentLang].score} ${gameScore}`);
                            goHome();
                        }
                    }, 1000);
                } else {
                    document.getElementById('game-timer-box').style.display = 'none';
                }
                nextGameQuestion();
            } else if (mode === 'match') {
                switchScreen('screen-match');
                initMatchGame();
            }
        }

        function renderExploreAnimal() {
            const animal = animalsData[currentExploreIndex];
            document.getElementById('exp-counter').innerText = `${currentExploreIndex + 1} / ${animalsData.length}`;
            document.getElementById('exp-name').innerText = animal.name[currentLang];
            document.getElementById('exp-fact').innerText = animal.fact[currentLang];
            
            const imgEl = document.getElementById('exp-img');
            imgEl.src = animal.img;
            imgEl.alt = animal.name[currentLang];
        }

        function nextExploreAnimal() {
            playSound('click');
            currentExploreIndex = (currentExploreIndex + 1) % animalsData.length;
            renderExploreAnimal();
        }

        function prevExploreAnimal() {
            playSound('click');
            currentExploreIndex = (currentExploreIndex - 1 + animalsData.length) % animalsData.length;
            renderExploreAnimal();
        }

        function nextGameQuestion() {
            document.getElementById('game-score-lbl').innerText = `${uiText[currentLang].score} ${gameScore}`;
            
            const target = animalsData[Math.floor(Math.random() * animalsData.length)];
            let options = [target];
            while (options.length < 4) {
                let rand = animalsData[Math.floor(Math.random() * animalsData.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            options.sort(() => Math.random() - 0.5);
            
            currentQuestion = { target, options };
            
            const container = document.getElementById('game-visual-container');
            const grid = document.getElementById('game-options-grid');
            grid.innerHTML = '';
            
            if (gameActiveMode === 'quiz' || gameActiveMode === 'timeAttack') {
                container.innerHTML = `
                    <div class="animal-img-wrap">
                        <img src="${target.img}" alt="Quiz Image">
                    </div>
                    <div style="font-weight: 700; color: #57606f; margin-top: 5px;">Pilih nama haiwan di bawah:</div>
                `;
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.name[currentLang];
                    btn.onclick = () => checkAnswer(opt.id === target.id, btn);
                    grid.appendChild(btn);
                });
            } else if (gameActiveMode === 'findName') {
                container.innerHTML = `
                    <h2 class="animal-title-display">${target.name[currentLang]}</h2>
                    <div style="font-weight: 700; color: #57606f; margin-top: 5px;">Pilih gambar haiwan yang sepadan:</div>
                `;
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.padding = '5px';
                    btn.innerHTML = `<img src="${opt.img}" style="width:100%; height:60px; border-radius:10px; object-fit:cover;" alt="option">`;
                    btn.onclick = () => checkAnswer(opt.id === target.id, btn);
                    grid.appendChild(btn);
                });
            }
        }

        function checkAnswer(isCorrect, btnElement) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => b.style.pointerEvents = 'none');
            
            if (isCorrect) {
                playSound('correct');
                btnElement.classList.add('correct');
                gameScore += 10;
                setTimeout(nextGameQuestion, 800);
            } else {
                playSound('wrong');
                btnElement.classList.add('wrong');
                if (gameActiveMode === 'timeAttack') {
                    setTimeout(nextGameQuestion, 800);
                } else {
                    setTimeout(() => {
                        showModal(uiText[currentLang].wrong, `${uiText[currentLang].score} ${gameScore}`);
                        goHome();
                    }, 800);
                }
            }
        }

        let selectedMatchItem = null;
        let matchedPairsCount = 0;

        function initMatchGame() {
            matchedPairsCount = 0;
            selectedMatchItem = null;
            document.getElementById('match-score-lbl').innerText = `${uiText[currentLang].matchScore} 0 / 4`;
            
            let subset = [...animalsData].sort(() => Math.random() - 0.5).slice(0, 4);
            let imagesCol = [...subset].sort(() => Math.random() - 0.5);
            let namesCol = [...subset].sort(() => Math.random() - 0.5);
            
            const grid = document.getElementById('match-grid');
            grid.innerHTML = `
                <div class="match-column" id="col-imgs"></div>
                <div class="match-column" id="col-names"></div>
            `;
            
            const imgColEl = document.getElementById('col-imgs');
            const nameColEl = document.getElementById('col-names');
            
            imagesCol.forEach(item => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.dataset.id = item.id;
                div.innerHTML = `<img src="${item.img}" style="width:100%; height:55px; border-radius:8px; object-fit:cover;" alt="match">`;
                div.onclick = () => selectMatchElement(div, 'img', item.id);
                imgColEl.appendChild(div);
            });
            
            namesCol.forEach(item => {
                const div = document.createElement('div');
                div.className = 'match-item';
                div.dataset.id = item.id;
                div.innerText = item.name[currentLang];
                div.onclick = () => selectMatchElement(div, 'name', item.id);
                nameColEl.appendChild(div);
            });
        }

        function selectMatchElement(element, type, id) {
            playSound('click');
            if (element.classList.contains('matched')) return;
            
            if (!selectedMatchItem) {
                selectedMatchItem = { element, type, id };
                element.classList.add('selected');
            } else {
                if (selectedMatchItem.element === element) {
                    element.classList.remove('selected');
                    selectedMatchItem = null;
                    return;
                }
                
                if (selectedMatchItem.type !== type && selectedMatchItem.id === id) {
                    playSound('correct');
                    selectedMatchItem.element.classList.remove('selected');
                    selectedMatchItem.element.classList.add('matched');
                    element.classList.add('matched');
                    selectedMatchItem = null;
                    
                    matchedPairsCount++;
                    document.getElementById('match-score-lbl').innerText = `${uiText[currentLang].matchScore} ${matchedPairsCount} / 4`;
                    
                    if (matchedPairsCount === 4) {
                        showModal(uiText[currentLang].congrats, "Semua padanan berjaya diselesaikan!");
                    }
                } else {
                    playSound('wrong');
                    selectedMatchItem.element.classList.remove('selected');
                    element.classList.add('wrong');
                    setTimeout(() => element.classList.remove('wrong'), 400);
                    selectedMatchItem = null;
                }
            }
        }

        function openGallery() {
            switchScreen('screen-gallery');
            renderGallery(animalsData);
        }

        function renderGallery(data) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            data.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'gallery-card';
                card.onclick = () => {
                    playSound('click');
                    showModal(animal.name[currentLang], `${animal.fact[currentLang]}`);
                };
                card.innerHTML = `
                    <img src="${animal.img}" alt="${animal.name.ms}">
                    <h4>${animal.name[currentLang]}</h4>
                    <span>${animal.category.toUpperCase()}</span>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery() {
            const query = document.getElementById('gallerySearch').value.toLowerCase();
            const category = document.getElementById('galleryCategory').value;
            
            const filtered = animalsData.filter(animal => {
                const matchesQuery = animal.name.ms.toLowerCase().includes(query) || 
                                     animal.name.en.toLowerCase().includes(query) || 
                                     animal.name.zh.includes(query);
                const matchesCategory = category === 'all' || animal.category === category;
                return matchesQuery && matchesCategory;
            });
            
            renderGallery(filtered);
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            playSound('click');
            document.getElementById('modalOverlay').style.display = 'none';
        }

        window.onload = function() {
            changeLanguage(currentLang);
        };
    </script>
</body>
</html>
