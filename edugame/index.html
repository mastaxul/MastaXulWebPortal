<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Kuiz Kenali Benda & Emoji Untuk Kanak-Kanak!</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2C3E50;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bubblegum Sans', sans-serif;
            background: linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 6px solid #FFF;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-btn, .counter-badge {
            background: var(--accent);
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #E6C200;
            transition: transform 0.1s;
        }

        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .score-board {
            font-size: 1.2rem;
            color: #2E7D32;
            font-weight: bold;
            background: #E8F5E9;
            padding: 8px 15px;
            border-radius: 15px;
        }

        .emoji-display {
            font-size: 110px;
            margin: 20px 0;
            display: inline-block;
            animation: bounce 2s infinite, pulse 1.5s infinite alternate;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-25px);}
            60% {transform: translateY(-12px);}
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .question-text {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 25px;
            font-weight: bold;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .btn-option {
            background: #F0F4F8;
            border: 3px solid #CBD5E1;
            border-radius: 20px;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 #CBD5E1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
        }

        .btn-option:hover {
            background: #E2E8F0;
            transform: translateY(-2px);
        }

        .btn-option:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-option.correct {
            background: #C6F6D5 !important;
            border-color: #38A169 !important;
            color: #22543D !important;
            box-shadow: 0 6px 0 #276749 !important;
            animation: pop 0.3s ease;
        }

        .btn-option.wrong {
            background: #FED7D7 !important;
            border-color: #E53E3E !important;
            color: #742A2A !important;
            box-shadow: 0 6px 0 #9B2C2C !important;
            animation: shake 0.4s ease;
        }

        @keyframes pop {
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .fill-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .fill-input {
            font-size: 1.8rem;
            letter-spacing: 5px;
            text-align: center;
            padding: 10px 20px;
            border: 3px solid var(--secondary);
            border-radius: 15px;
            width: 80%;
            outline: none;
            text-transform: uppercase;
            font-weight: bold;
        }

        .submit-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 0 #319795;
            font-weight: bold;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .confetti {
            position: absolute;
            pointer-events: none;
            width: 10px;
            height: 10px;
            background: #FFD700;
            border-radius: 50%;
            animation: fall 1s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">🌐 BM / EN</button>
        <div class="counter-badge" id="qCounter">Soalan: 1</div>
        <div class="score-board">⭐ <span id="score">0</span></div>
    </div>

    <div class="emoji-display" id="emoji">❓</div>
    <div class="question-text" id="question">Memuatkan soalan...</div>

    <div id="optionsContainer" class="options-grid"></div>
</div>

<script>
    // Data asas untuk menjana 500+ soalan unik secara dinamik
    const items = [
        // Haiwan
        { emoji: "🐱", bm: "Kucing", en: "Cat", category: "haiwan", actionBm: "mengiau", actionEn: "meows" },
        { emoji: "🐶", bm: "Anjing", en: "Dog", category: "haiwan", actionBm: "menyalak", actionEn: "barks" },
        { emoji: "🐘", bm: "Gajah", en: "Elephant", category: "haiwan", detailBm: "mempunyai belalai panjang", detailEn: "has a long trunk" },
        { emoji: "🦁", bm: "Singa", en: "Lion", category: "haiwan", detailBm: "raja rimba", detailEn: "king of the jungle" },
        { emoji: "🐵", bm: "Monyet", en: "Monkey", category: "haiwan", detailBm: "suka makan pisang", detailEn: "likes eating bananas" },
        { emoji: "🐸", bm: "Katak", en: "Frog", category: "haiwan", actionBm: "melompat", actionEn: "jumps" },
        { emoji: "🐍", bm: "Ular", en: "Snake", category: "haiwan", actionBm: "menyusur", actionEn: "slithers" },
        { emoji: "🐢", bm: "Kura-kura", en: "Turtle", category: "haiwan", detailBm: "berjalan sangat lambat", detailEn: "walks very slowly" },
        { emoji: "🐦", bm: "Burung", en: "Bird", category: "haiwan", actionBm: "terbang di udara", actionEn: "flies in the sky" },
        { emoji: "🐟", bm: "Ikan", en: "Fish", category: "haiwan", actionBm: "berenang dalam air", actionEn: "swims in water" },
        { emoji: "🐝", bm: "Lebah", en: "Bee", category: "haiwan", detailBm: "menghasilkan madu", detailEn: "produces honey" },
        { emoji: "🦋", bm: "Rama-rama", en: "Butterfly", category: "haiwan", detailBm: "mempunyai sayap yang cantik", detailEn: "has colorful wings" },
        
        // Kenderaan
        { emoji: "🚔", bm: "Kereta Polis", en: "Police Car", category: "kenderaan", detailBm: "digunakan untuk menangkap penjahat", detailEn: "used to catch criminals" },
        { emoji: "🚒", bm: "Kereta Bomba", en: "Fire Truck", category: "kenderaan", detailBm: "digunakan untuk memadam api", detailEn: "used to put out fires" },
        { emoji: "🚑", bm: "Ambulans", en: "Ambulance", category: "kenderaan", detailBm: "membawa orang sakit ke hospital", detailEn: "takes sick people to hospital" },
        { emoji: "🚀", bm: "Roket", en: "Rocket", category: "kenderaan", detailBm: "terbang ke angkasa lepas", detailEn: "flies into outer space" },
        { emoji: "Helikopter", emoji: "🚁", bm: "Helikopter", en: "Helicopter", category: "kenderaan", detailBm: "mempunyai bilah kipas di atas", detailEn: "has propeller blades on top" },
        { emoji: "✈️", bm: "Kapal Terbang", en: "Airplane", category: "kenderaan", detailBm: "mempunyai sayap besar untuk terbang", detailEn: "has big wings to fly" },
        { emoji: "🚂", bm: "Kereta Api", en: "Train", category: "kenderaan", detailBm: "bergerak di atas landasan besi", detailEn: "runs on railway tracks" },
        { emoji: "🚢", bm: "Kapal Laut", en: "Ship", category: "kenderaan", detailBm: "belayar di atas lautan luas", detailEn: "sails on the ocean" },
        { emoji: "🚲", bm: "Basikal", en: "Bicycle", category: "kenderaan", detailBm: "mempunyai dua roda dan perlu dikayuh", detailEn: "has two wheels and needs pedaling" },

        // Makanan & Buah
        { emoji: "🍎", bm: "Epal", en: "Apple", category: "makanan", detailBm: "buah berwarna merah atau hijau", detailEn: "red or green fruit" },
        { emoji: "🍌", bm: "Pisang", en: "Banana", category: "makanan", detailBm: "buah berwarna kuning kegemaran monyet", detailEn: "yellow fruit loved by monkeys" },
        { emoji: "🍕", bm: "Piza", en: "Pizza", category: "makanan", detailBm: "makanan berbentuk bulat dari Itali", detailEn: "round Italian food" },
        { emoji: "🍦", bm: "Aiskrim", en: "Ice Cream", category: "makanan", detailBm: "pencuci mulut yang manis dan sejuk", detailEn: "sweet and cold dessert" },
        { emoji: "🍔", bm: "Burger", en: "Burger", category: "makanan" },
        { emoji: "🍉", bm: "Tembikai", en: "Watermelon", category: "makanan" },
        { emoji: "🥕", bm: "Lobak", en: "Carrot", category: "makanan", detailBm: "makanan kegemaran arnab", detailEn: "rabbit's favorite food" },

        // Objek & Alat
        { emoji: "🗑️", bm: "Bakul Sampah", en: "Trash Bin", category: "objek", detailBm: "tempat membuang sampah", detailEn: "place to throw trash" },
        { emoji: "⛱️", bm: "Payung", en: "Umbrella", category: "objek", detailBm: "melindungi daripada hujan dan panas", detailEn: "protects from rain and sun" },
        { emoji: "🔑", bm: "Kunci", en: "Key", category: "objek", detailBm: "digunakan untuk membuka pintu", detailEn: "used to unlock doors" },
        { emoji: "🧲", bm: "Magnet", en: "Magnet", category: "objek", detailBm: "dapat menarik besi", detailEn: "attracts metal objects" },
        { emoji: "✂️", bm: "Gunting", en: "Scissors", category: "objek", detailBm: "digunakan untuk memotong kertas", detailEn: "used to cut paper" },
        { emoji: "👓", bm: "Cermin Mata", en: "Glasses", category: "objek", detailBm: "dipakai pada mata untuk melihat jelas", detailEn: "worn on eyes to see clearly" },
        { emoji: "⏰", bm: "Jam Loceng", en: "Alarm Clock", category: "objek", detailBm: "mengejutkan kita dari tidur", detailEn: "wakes us up from sleep" },
        { emoji: "🧹", bm: "Penyapu", en: "Broom", category: "objek", detailBm: "digunakan untuk menyapu lantai", detailEn: "used to sweep the floor" },
        { emoji: "🎈", bm: "Belon", en: "Balloon", category: "objek" },
        { emoji: "💡", bm: "Lampu", en: "Light Bulb", category: "objek", detailBm: "menerangi kawasan gelap", detailEn: "gives light in the dark" },

        // Bangunan & Tempat
        { emoji: "🕋", bm: "Kaabah", en: "Kaaba", category: "tempat" },
        { emoji: "🏫", bm: "Sekolah", en: "School", category: "tempat", detailBm: "tempat murid belajar", detailEn: "place where students learn" },
        { emoji: "🏥", bm: "Hospital", en: "Hospital", category: "tempat", detailBm: "tempat doktor merawat orang sakit", detailEn: "place where doctors treat sick people" },
        { emoji: "🎪", bm: "Sirkus", en: "Circus", category: "tempat" },
        { emoji: "🏠", bm: "Rumah", en: "House", category: "tempat", detailBm: "tempat tinggal keluarga", detailEn: "place where family lives" }
    ];

    let currentLang = 'bm'; // 'bm' atau 'en'
    let currentScore = 0;
    let questionIndex = 1;
    let currentQuestionData = {};

    // Menjana variasi soalan unik (Pola soalan dikombinasikan untuk menghasilkan >500 kombinasi)
    function generateQuestion() {
        const item = items[Math.floor(Math.random() * items.length)];
        const questionTypes = ['identify', 'spelling', 'category', 'function'];
        const qType = questionTypes[Math.floor(Math.random() * questionTypes.length)];

        let qData = {
            emoji: item.emoji,
            type: qType,
            correctAnswer: currentLang === 'bm' ? item.bm : item.en
        };

        if (qType === 'identify') {
            qData.questionText = currentLang === 'bm' ? `Apakah nama benda/haiwan ini?` : `What object/animal is this?`;
            qData.options = generateOptions(qData.correctAnswer);
        } else if (qType === 'category') {
            qData.questionText = currentLang === 'bm' ? `Apakah kategori bagi ${item.emoji}?` : `What category does ${item.emoji} belong to?`;
            
            const catsBm = { haiwan: "Haiwan", kenderaan: "Kenderaan", makanan: "Makanan / Buah", objek: "Alat / Objek", tempat: "Bangunan / Tempat" };
            const catsEn = { haiwan: "Animal", kenderaan: "Vehicle", makanan: "Food / Fruit", objek: "Tool / Object", tempat: "Building / Place" };
            
            qData.correctAnswer = currentLang === 'bm' ? catsBm[item.category] : catsEn[item.category];
            
            let allCats = currentLang === 'bm' ? Object.values(catsBm) : Object.values(catsEn);
            qData.options = shuffleArray([qData.correctAnswer, ...allCats.filter(c => c !== qData.correctAnswer).slice(0, 2)]);
        } else if (qType === 'function' && (item.detailBm || item.actionBm)) {
            const detail = currentLang === 'bm' ? (item.detailBm || item.actionBm) : (item.detailEn || item.actionEn);
            qData.questionText = currentLang === 'bm' ? `Benda ini ${detail}:` : `This object/animal ${detail}:`;
            qData.options = generateOptions(qData.correctAnswer);
        } else {
            // Default kepada Ejaan / Spelling Fill-in
            qData.type = 'spelling';
            qData.questionText = currentLang === 'bm' ? `Lengkapkan ejaan nama alat/benda ini:` : `Complete the spelling for this item:`;
            qData.word = currentLang === 'bm' ? item.bm : item.en;
        }

        return qData;
    }

    function generateOptions(correct) {
        let options = [correct];
        while (options.length < 3) {
            let randomItem = items[Math.floor(Math.random() * items.length)];
            let val = currentLang === 'bm' ? randomItem.bm : randomItem.en;
            if (!options.includes(val)) {
                options.push(val);
            }
        }
        return shuffleArray(options);
    }

    function shuffleArray(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function renderQuestion() {
        currentQuestionData = generateQuestion();
        
        document.getElementById('qCounter').innerText = currentLang === 'bm' ? `Soalan: ${questionIndex}` : `Question: ${questionIndex}`;
        document.getElementById('emoji').innerText = currentQuestionData.emoji;
        document.getElementById('question').innerText = currentQuestionData.questionText;

        const optionsContainer = document.getElementById('optionsContainer');
        optionsContainer.innerHTML = '';

        if (currentQuestionData.type === 'spelling') {
            const word = currentQuestionData.word;
            const hint = word.charAt(0) + " _ ".repeat(word.length - 1);

            optionsContainer.innerHTML = `
                <div class="fill-input-container">
                    <div style="font-size: 2rem; font-weight: bold; color: var(--secondary);">${hint}</div>
                    <input type="text" id="spellingInput" class="fill-input" placeholder="..." autocomplete="off">
                    <button class="submit-btn" onclick="checkSpellingAnswer()">${currentLang === 'bm' ? 'Hantar' : 'Submit'}</button>
                </div>
            `;
        } else {
            currentQuestionData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerHTML = `<span>${String.fromCharCode(65 + idx)}.</span> <span>${opt}</span>`;
                btn.onclick = () => checkOptionAnswer(btn, opt);
                optionsContainer.appendChild(btn);
            });
        }
    }

    function checkOptionAnswer(selectedBtn, answer) {
        disableAllOptions();
        if (answer === currentQuestionData.correctAnswer) {
            selectedBtn.classList.add('correct');
            addScore();
            triggerConfetti();
        } else {
            selectedBtn.classList.add('wrong');
            // Tunjukkan jawapan betul
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach(btn => {
                if (btn.innerText.includes(currentQuestionData.correctAnswer)) {
                    btn.classList.add('correct');
                }
            });
        }
        nextQuestion();
    }

    function checkSpellingAnswer() {
        const input = document.getElementById('spellingInput');
        if (!input) return;

        const userAns = input.value.trim().toLowerCase();
        const correctAns = currentQuestionData.word.toLowerCase();

        if (userAns === correctAns) {
            input.style.borderColor = "#38A169";
            input.style.backgroundColor = "#C6F6D5";
            addScore();
            triggerConfetti();
        } else {
            input.style.borderColor = "#E53E3E";
            input.style.backgroundColor = "#FED7D7";
            alert((currentLang === 'bm' ? "Jawapan betul: " : "Correct answer: ") + currentQuestionData.word);
        }
        nextQuestion();
    }

    function disableAllOptions() {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(b => b.disabled = true);
    }

    function addScore() {
        currentScore += 10;
        document.getElementById('score').innerText = currentScore;
    }

    function nextQuestion() {
        questionIndex++;
        setTimeout(() => {
            renderQuestion();
        }, 1500);
    }

    function toggleLanguage() {
        currentLang = currentLang === 'bm' ? 'en' : 'bm';
        document.getElementById('langBtn').innerText = currentLang === 'bm' ? '🌐 BM / EN' : '🌐 EN / BM';
        renderQuestion();
    }

    function triggerConfetti() {
        for (let i = 0; i < 20; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF80AB'][Math.floor(Math.random() * 4)];
            document.body.appendChild(confetti);

            setTimeout(() => confetti.remove(), 1000);
        }
    }

    // Mula Permainan
    renderQuestion();
</script>

</body>
</html>
