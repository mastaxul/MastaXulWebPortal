<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Masta Xul</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f2ef;
      color: #111;
      padding: 20px 16px 60px;
    }
    .box {
      max-width: 520px;
      margin: 0 auto;
      background: #fff;
      border: 2px solid #6B4423;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(107,68,35,0.1);
    }
    h1 { font-size: 1.35rem; margin-bottom: 4px; text-align: center; }
    .sub { text-align: center; color: #6B4423; font-size: 0.9rem; margin-bottom: 22px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin: 14px 0 6px; }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #6B4423;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { border-color: #D32F2F; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button[type="submit"] {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #D32F2F;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
    button[type="submit"]:hover:not(:disabled) { background: #111; }
    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
    }
    .msg.ok { display: block; background: #e8f5e9; color: #2E7D32; }
    .msg.err { display: block; background: #ffebee; color: #c62828; }
    .msg.warn { display: block; background: #fff8e1; color: #8a6100; }
    .hint { font-size: 0.8rem; color: #888; margin-top: 4px; }
    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #6B4423;
      font-weight: 600;
      text-decoration: none;
    }
    .upload-box {
      border: 2px dashed #6B4423;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      background: #faf7f4;
    }
    .upload-box input[type="file"] { border: none; padding: 8px 0; }
    .preview {
      margin-top: 12px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      display: none;
      object-fit: contain;
      background: #f0ebe6;
    }
    .upload-status { font-size: 0.85rem; margin-top: 8px; color: #6B4423; }
    .ocr-status { font-size: 0.85rem; margin-top: 6px; color: #0088cc; font-weight: 600; }
    .checkbox-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .chk {
      display: flex; align-items: center; gap: 6px;
      border: 2px solid #6B4423; border-radius: 20px;
      padding: 7px 12px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; background: #fff; margin: 0;
    }
    .chk input { width: auto; margin: 0; accent-color: #D32F2F; }

    /* Captcha — hanya muncul setiap 3 hantaran */
    .captcha-wrap {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border: 2px dashed #D32F2F;
      border-radius: 12px;
      background: #fff5f5;
    }
    .captcha-wrap.show { display: block; }
    .captcha-wrap label { margin-top: 0; color: #c62828; }
    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .captcha-q {
      font-weight: 700;
      font-size: 1.15rem;
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      letter-spacing: 1px;
    }
    .captcha-row input {
      width: 100px;
      margin: 0;
    }
    .captcha-refresh {
      border: 2px solid #6B4423;
      background: #fff;
      color: #111;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .submit-hint {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Dashboard Admin</h1>
    <p class="sub">Tambah produk · Upload gambar ImgBB</p>

    <form id="formProduk">
      <label>Password admin *</label>
      <input type="password" id="password" required placeholder="Isi dulu sebelum upload gambar" autocomplete="off">

      <label>Gambar produk</label>
      <div class="upload-box">
        <input type="file" id="fileGambar" accept="image/*">
        <p class="hint">Isi password dulu → pilih gambar → auto upload + analisis AI</p>
        <p class="upload-status" id="uploadStatus"></p>
        <p class="ocr-status" id="ocrStatus"></p>
        <img id="preview" class="preview" alt="Preview">
      </div>

      <label>Link gambar (auto / manual)</label>
      <input type="url" id="gambar" placeholder="Akan diisi automatik selepas upload">

      <label>ID (kosongkan = auto)</label>
      <input type="text" id="id" placeholder="Contoh: 31">

      <label>Nama produk *</label>
      <input type="text" id="nama" required placeholder="Nama produk">

      <div class="row">
        <div>
          <label>Harga *</label>
          <input type="text" id="harga" required placeholder="89.90">
        </div>
        <div>
          <label>Terjual</label>
          <input type="text" id="terjual" placeholder="120">
        </div>
      </div>

      <label>Kategori</label>
      <div class="checkbox-grid" id="kategoriGrid">
        <label class="chk"><input type="checkbox" value="Viral"> Viral</label>
        <label class="chk"><input type="checkbox" value="Kesihatan"> Kesihatan</label>
        <label class="chk"><input type="checkbox" value="Gadget"> Gadget</label>
        <label class="chk"><input type="checkbox" value="Rumah"> Rumah</label>
        <label class="chk"><input type="checkbox" value="Kecantikan"> Kecantikan</label>
        <label class="chk"><input type="checkbox" value="Pertanian"> Pertanian</label>
        <label class="chk"><input type="checkbox" value="Dapur"> Dapur</label>
        <label class="chk"><input type="checkbox" value="Lelaki"> Lelaki</label>
        <label class="chk"><input type="checkbox" value="Wanita"> Wanita</label>
        <label class="chk"><input type="checkbox" value="Pakaian"> Pakaian</label>
        <label class="chk"><input type="checkbox" value="Sukan"> Sukan</label>
        <label class="chk"><input type="checkbox" value="Perhiasan"> Perhiasan</label>
        <label class="chk"><input type="checkbox" value="Elektrik"> Elektrik</label>
        <label class="chk"><input type="checkbox" value="Tumbuhan"> Tumbuhan</label>
      </div>
      <input type="text" id="kategoriLain" placeholder="Kategori lain (pisah dengan koma)" style="margin-top:10px;">

      <label>Badge</label>
      <select id="badge">
        <option value="">Tiada</option>
        <option value="Hot">Hot</option>
        <option value="Viral">Viral</option>
        <option value="Terlaris">Terlaris</option>
        <option value="Mantap">Mantap</option>
        <option value="__lain__">Lain (taip sendiri)</option>
      </select>
      <input type="text" id="badgeLain" placeholder="Taip badge baru" style="display:none; margin-top:8px;">

      <label>Link TikTok</label>
      <input type="url" id="tiktok" placeholder="https://...">

      <label>Link Shopee</label>
      <input type="url" id="shopee" placeholder="https://...">

      <label>Link Lazada</label>
      <input type="url" id="lazada" placeholder="https://...">

      <label>Deskripsi</label>
      <textarea id="deskripsi" placeholder="Penerangan produk..."></textarea>

      <!-- Captcha: hanya papar setiap 3 hantaran berjaya -->
      <div class="captcha-wrap" id="captchaWrap">
        <label>🔒 Captcha (wajib setiap 3 produk)</label>
        <div class="captcha-row">
          <span class="captcha-q" id="captchaQ">?</span>
          <input type="number" id="captchaA" placeholder="Jawapan" inputmode="numeric">
          <button type="button" class="captcha-refresh" id="btnCaptchaRefresh" title="Soalan baru">↻</button>
        </div>
        <p class="hint">Hantaran ke-3, ke-6, ke-9… perlu jawab captcha ini.</p>
      </div>

      <button type="submit" id="btnSubmit">Tambah Produk</button>
      <p class="submit-hint" id="submitHint"></p>
    </form>

    <div class="msg" id="msg"></div>
    <a class="back" href="/shop/">← Ke Shop</a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx5tijI4QHYTNap-YEN5i9-ZGfDIZ1IcGqUsZNi32s9gtOT9sIV0GcsUPzPka4srYujRA/exec";
    const CAPTCHA_EVERY = 3; // captcha pada hantaran ke-3, 6, 9...
    const STORAGE_KEY = "mx_admin_submit_count";

    const form = document.getElementById("formProduk");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btnSubmit");
    const fileInput = document.getElementById("fileGambar");
    const preview = document.getElementById("preview");
    const uploadStatus = document.getElementById("uploadStatus");
    const gambarInput = document.getElementById("gambar");
    const badgeSelect = document.getElementById("badge");
    const badgeLain = document.getElementById("badgeLain");
    const ocrStatus = document.getElementById("ocrStatus");
    const namaInput = document.getElementById("nama");
    const deskripsiInput = document.getElementById("deskripsi");
    const captchaWrap = document.getElementById("captchaWrap");
    const captchaQ = document.getElementById("captchaQ");
    const captchaA = document.getElementById("captchaA");
    const submitHint = document.getElementById("submitHint");

    let captchaJawapan = 0;

    function getSubmitCount() {
      const n = parseInt(sessionStorage.getItem(STORAGE_KEY) || "0", 10);
      return isNaN(n) || n < 0 ? 0 : n;
    }

    function setSubmitCount(n) {
      sessionStorage.setItem(STORAGE_KEY, String(n));
    }

    // Hantaran seterusnya (count+1) perlu captcha jika gandaan 3
    function perluCaptcha() {
      return (getSubmitCount() + 1) % CAPTCHA_EVERY === 0;
    }

    function buatCaptcha() {
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 2;
      captchaJawapan = a + b;
      captchaQ.textContent = a + " + " + b + " = ?";
      captchaA.value = "";
    }

    function kemaskiniCaptchaUI() {
      const count = getSubmitCount();
      const next = count + 1;
      if (perluCaptcha()) {
        captchaWrap.classList.add("show");
        captchaA.required = true;
        buatCaptcha();
        submitHint.textContent = "Hantaran #" + next + " — captcha wajib.";
      } else {
        captchaWrap.classList.remove("show");
        captchaA.required = false;
        captchaA.value = "";
        const tinggal = CAPTCHA_EVERY - (next % CAPTCHA_EVERY);
        submitHint.textContent =
          "Hantaran berjaya: " + count + " · Captcha seterusnya selepas " + tinggal + " produk lagi.";
      }
    }

    document.getElementById("btnCaptchaRefresh").addEventListener("click", buatCaptcha);

    badgeSelect.addEventListener("change", () => {
      badgeLain.style.display = badgeSelect.value === "__lain__" ? "block" : "none";
      if (badgeSelect.value === "__lain__") badgeLain.focus();
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(",")[1];
          resolve({ base64, mimeType: file.type || "image/jpeg" });
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function jalankanOCR(file, password) {
      ocrStatus.textContent = "🔍 Menganalisis gambar dengan AI...";
      try {
        const { base64, mimeType } = await fileToBase64(file);
        const res = await fetch("/api/ocr-gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, imageBase64: base64, mimeType })
        });
        const result = await res.json();

        if (res.status === 401) {
          ocrStatus.textContent = "❌ Password salah — analisis AI tak dijalankan.";
          return;
        }
        if (!result.ok || !result.data) {
          ocrStatus.textContent = "⚠️ AI tak dapat analisis — isi manual.";
          return;
        }

        const cadangan = result.data;
        if (!namaInput.value.trim() && cadangan.nama) namaInput.value = cadangan.nama;
        if (!deskripsiInput.value.trim() && cadangan.deskripsi) deskripsiInput.value = cadangan.deskripsi;
        if (!badgeSelect.value && cadangan.badge) {
          const ada = Array.from(badgeSelect.options).some(o => o.value === cadangan.badge);
          if (ada) badgeSelect.value = cadangan.badge;
        }
        if (cadangan.kategori_cadangan) {
          const checkbox = document.querySelector(
            '#kategoriGrid input[value="' + cadangan.kategori_cadangan.replace(/"/g, "") + '"]'
          );
          if (checkbox && !checkbox.checked) checkbox.checked = true;
        }
        ocrStatus.textContent = "✅ Analisis AI siap — semak sebelum hantar.";
      } catch (err) {
        console.error(err);
        ocrStatus.textContent = "⚠️ Analisis AI gagal — isi manual.";
      }
    }

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const password = document.getElementById("password").value.trim();
      if (!password) {
        uploadStatus.textContent = "🔒 Isi password admin dulu, kemudian pilih gambar semula.";
        fileInput.value = "";
        return;
      }

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      uploadStatus.textContent = "⏳ Sedang upload gambar...";
      ocrStatus.textContent = "";
      btn.disabled = true;

      const uploadPromise = (async () => {
        try {
          const formData = new FormData();
          formData.append("password", password);
          formData.append("image", file);
          const res = await fetch("/api/upload-gambar", { method: "POST", body: formData });
          const data = await res.json();
          if (res.status === 401) {
            uploadStatus.textContent = "❌ Password salah — gambar tak dimuat naik.";
          } else if (data.success && data.url) {
            gambarInput.value = data.url;
            uploadStatus.textContent = "✅ Upload berjaya";
          } else {
            uploadStatus.textContent = "❌ Upload gagal. Paste link manual jika perlu.";
          }
        } catch (err) {
          console.error(err);
          uploadStatus.textContent = "❌ Ralat upload. Paste link manual jika perlu.";
        }
      })();

      await Promise.all([uploadPromise, jalankanOCR(file, password)]);
      btn.disabled = false;
    });

    function ambilKategoriGabungan() {
      const dipilih = Array.from(
        document.querySelectorAll('#kategoriGrid input[type="checkbox"]:checked')
      ).map(c => c.value);
      const lain = document.getElementById("kategoriLain").value.trim();
      if (lain) {
        lain.split(",").map(s => s.trim()).filter(Boolean).forEach(k => {
          if (!dipilih.includes(k)) dipilih.push(k);
        });
      }
      return dipilih.join(", ");
    }

    function ambilBadge() {
      if (badgeSelect.value === "__lain__") return badgeLain.value.trim();
      return badgeSelect.value;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";

      // ===== CAPTCHA setiap 3 hantaran =====
      if (perluCaptcha()) {
        const jawapan = parseInt(captchaA.value, 10);
        if (jawapan !== captchaJawapan) {
          msg.className = "msg err";
          msg.textContent = "❌ Captcha salah. Sila cuba lagi.";
          buatCaptcha();
          return;
        }
      }

      btn.disabled = true;
      btn.textContent = "Menghantar...";

      const payload = {
        password: document.getElementById("password").value.trim(),
        id: document.getElementById("id").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        harga: document.getElementById("harga").value.trim(),
        terjual: document.getElementById("terjual").value.trim(),
        kategori: ambilKategoriGabungan(),
        badge: ambilBadge(),
        gambar: document.getElementById("gambar").value.trim(),
        tiktok: document.getElementById("tiktok").value.trim(),
        shopee: document.getElementById("shopee").value.trim(),
        lazada: document.getElementById("lazada").value.trim(),
        deskripsi: document.getElementById("deskripsi").value.trim()
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.ok) {
          const newCount = getSubmitCount() + 1;
          setSubmitCount(newCount);

          msg.className = "msg ok";
          msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — menyegerak cache...";

          const passwordAsal = payload.password;
          form.reset();
          document.getElementById("password").value = passwordAsal;
          preview.style.display = "none";
          uploadStatus.textContent = "";
          ocrStatus.textContent = "";
          badgeLain.style.display = "none";

          kemaskiniCaptchaUI();

          try {
            const refreshRes = await fetch("/api/produk/refresh", {
              headers: { "X-Admin-Pass": passwordAsal }
            });
            if (!refreshRes.ok) throw new Error("Refresh " + refreshRes.status);
            msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — cache OK, boleh share!";
          } catch (refreshErr) {
            console.error(refreshErr);
            msg.textContent = "✅ " + data.message + " (ID: " + data.id + ") — cache auto gagal; ~10 minit.";
          }
        } else {
          msg.className = "msg err";
          msg.textContent = "❌ " + (data.message || "Gagal");
          if (perluCaptcha()) buatCaptcha();
        }
      } catch (err) {
        console.error(err);
        msg.className = "msg warn";
        msg.textContent = "⚠️ Status tak dapat disahkan. Semak sheet PRODUK.";
        if (perluCaptcha()) buatCaptcha();
      }

      btn.disabled = false;
      btn.textContent = "Tambah Produk";
    });

    // Init UI captcha
    kemaskiniCaptchaUI();
  </script>
</body>
</html>
