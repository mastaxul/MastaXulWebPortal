<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Masta Xul</title>
  <meta name="description" content="Artikel dan tip dari Masta Xul — produk, affiliate, dan idea berguna.">
  <meta name="robots" content="index, follow">
  <style>
    body{background:#0b0f19;color:#e8eef7;font-family:system-ui,-apple-system,sans-serif;margin:0;line-height:1.6}
    .wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
    header.blog-head{text-align:center;padding:28px 0 18px;border-bottom:1px solid #283244}
    header.blog-head h1{margin:0 0 6px;font-size:1.6rem}
    header.blog-head p{margin:0;color:#8f9bad;font-size:.95rem}
    .nav-mini{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .nav-mini a{color:#6ea8fe;text-decoration:none;font-size:.88rem}
    .post-list{margin-top:22px;display:flex;flex-direction:column;gap:14px}
    .post-card{display:block;background:#121826;border:1px solid #283244;border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:.15s}
    .post-card:hover{border-color:#6ea8fe;transform:translateY(-1px)}
    .post-card h2{margin:0 0 6px;font-size:1.15rem;color:#fff}
    .post-card .meta{font-size:.78rem;color:#8f9bad;margin-bottom:8px}
    .post-card .excerpt{font-size:.92rem;color:#b8c1d0}
    .post-card .thumb{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px;background:#1a2230}
    .empty{text-align:center;color:#8f9bad;padding:40px 10px}
    .article{margin-top:20px}
    .article h1{font-size:1.55rem;margin:0 0 8px;line-height:1.3}
    .article .meta{color:#8f9bad;font-size:.85rem;margin-bottom:18px}
    .article .cover{width:100%;max-height:420px;object-fit:contain;border-radius:12px;margin-bottom:18px;background:#111827}
    .article .content{font-size:1.02rem;color:#dce4ef}
    .article .content p{margin:0 0 1em}
    .article .content img{max-width:100%;height:auto;border-radius:10px;margin:12px 0;display:block}
    .video-block{margin:18px 0;border-radius:12px;overflow:hidden;background:#0a0a0a;border:1px solid #283244}
    .video-block iframe,.video-block video{width:100%;aspect-ratio:16/9;border:0;display:block;min-height:220px}
    .video-block.tiktok{max-width:420px;margin-left:auto;margin-right:auto}
    .video-block.tiktok iframe{aspect-ratio:9/16;min-height:480px;max-height:720px}
    .video-fallback{padding:16px;text-align:center}
    .video-fallback a{color:#6ea8fe;font-weight:600}
    .back{display:inline-block;margin:12px 0 8px;color:#6ea8fe;text-decoration:none;font-size:.9rem}
    footer{text-align:center;color:#667085;font-size:.8rem;margin-top:40px}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="blog-head">
      <h1 id="pageTitle">Blog Masta Xul</h1>
      <p id="pageSub">Artikel & tip pilihan</p>
      <div class="nav-mini">
        <a href="/">Laman Utama</a>
        <a href="/shop/">Shop</a>
        <a href="/blog/">Semua Artikel</a>
      </div>
    </header>

    <div id="listView">
      <div class="post-list" id="postList">
        <div class="empty">Memuatkan artikel…</div>
      </div>
    </div>

    <div id="articleView" style="display:none">
      <a class="back" href="/blog/">← Semua artikel</a>
      <article class="article">
        <h1 id="artTitle"></h1>
        <div class="meta" id="artMeta"></div>
        <img id="artCover" class="cover" alt="" style="display:none" loading="lazy">
        <div id="artVideos"></div>
        <div class="content" id="artContent"></div>
      </article>
    </div>

    <footer>© Masta Xul · Blog</footer>
  </div>

<script>
const BLOG_API = "https://script.google.com/macros/s/AKfycbyx_ovUg3Nuw6N49nve0zdToASgP3F-cTQClP0cIshCrvdWWcLox5IXtk55FfnVmRAG/exec";

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function getSlug(){
  const q = new URLSearchParams(location.search);
  if (q.get("slug")) return q.get("slug").trim();
  const parts = location.pathname.replace(/\/+$/,"").split("/").filter(Boolean);
  if (parts[0]==="blog" && parts[1] && !/\.html?$/i.test(parts[1])) {
    return decodeURIComponent(parts[1]);
  }
  return "";
}

/** Cover mesti URL gambar terus (i.ibb.co / .jpg), bukan halaman album */
function isDirectImage(url){
  if (!url) return false;
  if (/ibb\.co\/album\//i.test(url)) return false;
  if (/i\.ibb\.co\//i.test(url)) return true;
  if (/\.(jpe?g|png|gif|webp|avif)(\?|$)/i.test(url)) return true;
  if (/^https?:\/\/.*\.(googleusercontent|imgur|cloudinary|imgbb)/i.test(url)) return true;
  return false;
}

function youtubeId(url){
  const m = String(url).match(
    /(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/i
  );
  return m ? m[1] : "";
}

function tiktokVideoId(url){
  let m = String(url).match(/tiktok\.com\/@[^/]+\/video\/(\d+)/i);
  if (m) return m[1];
  m = String(url).match(/tiktok\.com\/.*[?&]video[_-]?id=(\d+)/i);
  if (m) return m[1];
  // API sudah resolve short link → full URL dalam field resolved / id
  return "";
}

function embedVideo(item){
  // item boleh string URL atau {url, id, platform}
  let url = "";
  let id = "";
  let platform = "";
  if (typeof item === "string") {
    url = item.trim();
  } else if (item && typeof item === "object") {
    url = String(item.url || item.resolved || "").trim();
    id = String(item.id || "").trim();
    platform = String(item.platform || "").toLowerCase();
  }
  if (!url && !id) return "";

  // ---- YouTube ----
  const yt = id && platform === "youtube" ? id : youtubeId(url);
  if (yt) {
    return `<div class="video-block"><iframe src="https://www.youtube.com/embed/${esc(yt)}?rel=0" allowfullscreen allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  }

  // ---- TikTok ----
  const tt = id && (platform === "tiktok" || !platform) ? id : tiktokVideoId(url);
  if (tt) {
    return `<div class="video-block tiktok"><iframe src="https://www.tiktok.com/player/v1/${esc(tt)}?music_info=1&description=1" allow="fullscreen;encrypted-media" loading="lazy"></iframe></div>`;
  }
  // Short link belum resolve
  if (/vt\.tiktok\.com|vm\.tiktok\.com/i.test(url)) {
    return `<div class="video-block"><div class="video-fallback">
      <p>Video TikTok (pautan pendek)</p>
      <a href="${esc(url)}" target="_blank" rel="noopener">▶ Buka di TikTok</a>
      <p style="font-size:.8rem;color:#8f9bad;margin-top:8px">Tip: dalam admin, paste link penuh<br>tiktok.com/@user/video/123… atau deploy Code.gs v2 (auto-resolve)</p>
    </div></div>`;
  }

  // ---- Instagram ----
  let m = url.match(/instagram\.com\/(p|reel|tv)\/([A-Za-z0-9_-]+)/i);
  if (m) {
    return `<div class="video-block"><iframe src="https://www.instagram.com/${m[1]}/${m[2]}/embed" loading="lazy" allowfullscreen></iframe></div>`;
  }

  // ---- Facebook ----
  if (/facebook\.com\//i.test(url) && /video|fb\.watch|reel/i.test(url)) {
    return `<div class="video-block"><iframe src="https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0&width=720" allowFullScreen loading="lazy"></iframe></div>`;
  }

  // ---- Direct video file ----
  if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) {
    return `<div class="video-block"><video controls playsinline preload="metadata" src="${esc(url)}"></video></div>`;
  }

  // ---- Image mistaken in videos field ----
  if (isDirectImage(url)) {
    return `<p><img src="${esc(url)}" alt="Gambar" style="max-width:100%;border-radius:10px"></p>`;
  }

  return `<div class="video-fallback"><a href="${esc(url)}" target="_blank" rel="noopener">▶ Buka media</a></div>`;
}

/** Jadikan URL gambar dalam teks jadi <img> */
function enhanceHtml(html){
  // Auto-link image URLs on their own line already as text
  return html;
}

async function loadList(){
  const box = document.getElementById("postList");
  try{
    const r = await fetch(BLOG_API + "?action=list&_=" + Date.now());
    const d = await r.json();
    if (!d.ok) throw new Error(d.message||"Gagal");
    const posts = d.posts || [];
    if (!posts.length){
      box.innerHTML = '<div class="empty">Belum ada artikel diterbitkan.</div>';
      return;
    }
    box.innerHTML = posts.map(p => {
      const href = "/blog/" + encodeURIComponent(p.slug);
      const thumb = isDirectImage(p.cover)
        ? `<img class="thumb" src="${esc(p.cover)}" alt="" loading="lazy">`
        : "";
      return `
      <a class="post-card" href="${href}">
        ${thumb}
        <h2>${esc(p.title)}</h2>
        <div class="meta">${esc(p.updated || p.timestamp || "")}</div>
        <div class="excerpt">${esc(p.excerpt || "")}</div>
      </a>`;
    }).join("");
  }catch(e){
    box.innerHTML = '<div class="empty">Gagal memuatkan senarai.</div>';
  }
}

async function loadArticle(slug){
  document.getElementById("listView").style.display = "none";
  document.getElementById("articleView").style.display = "block";
  document.getElementById("pageTitle").textContent = "Artikel";
  document.getElementById("pageSub").textContent = "Masta Xul Blog";
  document.getElementById("artTitle").textContent = "Memuatkan…";
  try{
    const r = await fetch(BLOG_API + "?action=get&slug=" + encodeURIComponent(slug) + "&_=" + Date.now());
    const d = await r.json();
    if (!d.ok || !d.post) throw new Error(d.message||"Tidak dijumpai");
    const p = d.post;
    document.title = p.title + " | Masta Xul Blog";
    document.getElementById("artTitle").textContent = p.title;
    document.getElementById("artMeta").textContent =
      (p.updated || p.timestamp || "") + " · mastaxul.my/blog/" + p.slug;

    const cover = document.getElementById("artCover");
    if (isDirectImage(p.cover)) {
      cover.src = p.cover;
      cover.alt = p.title;
      cover.style.display = "block";
      cover.onerror = () => { cover.style.display = "none"; };
    } else {
      cover.style.display = "none";
    }

    const vids = Array.isArray(p.videos) ? p.videos : [];
    document.getElementById("artVideos").innerHTML = vids.map(embedVideo).join("") || "";

    document.getElementById("artContent").innerHTML = enhanceHtml(p.html || "<p></p>");

    let md = document.querySelector('meta[name="description"]');
    if (md && p.excerpt) md.setAttribute("content", p.excerpt);
  }catch(e){
    document.getElementById("artTitle").textContent = "Artikel tidak dijumpai";
    document.getElementById("artContent").innerHTML = "<p>Slug tidak sah atau belum diterbitkan.</p>";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const slug = getSlug();
  if (slug) loadArticle(slug);
  else loadList();
});
</script>
</body>
</html>
