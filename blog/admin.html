<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulis Artikel | Admin Masta Xul</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    body{font-family:system-ui,sans-serif;background:#0b0f19;color:#e8eef7;margin:0;padding:20px}
    .box{max-width:640px;margin:0 auto;background:#121826;border:1px solid #283244;border-radius:14px;padding:20px}
    h1{font-size:1.25rem;margin:0 0 8px}
    label{display:block;font-size:.85rem;color:#8f9bad;margin:12px 0 5px}
    input,textarea,select{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid #283244;background:#0c111a;color:#fff;font:inherit}
    textarea{min-height:200px;resize:vertical}
    button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#3d7eff;color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5}
    button.secondary{background:#1b2433;border:1px solid #283244;margin-top:8px}
    .msg{margin-top:12px;padding:10px;border-radius:8px;display:none;text-align:center;font-weight:600}
    .msg.ok{display:block;background:rgba(57,217,138,.12);color:#7df0b3}
    .msg.err{display:block;background:rgba(255,107,107,.12);color:#ff9292}
    .hint{font-size:.78rem;color:#8f9bad;margin-top:6px}
    a{color:#6ea8fe}
    .preview-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .preview-grid img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid #283244}
    .turnstile-wrap{display:flex;justify-content:center;margin:14px 0;min-height:65px}
    .upload-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .upload-row input[type=file]{flex:1;min-width:160px}
    .publish-date-box{margin-top:12px;padding:12px 14px;border-radius:10px;background:#0c111a;border:1px solid #283244}
    .publish-date-box .label{font-size:.78rem;color:#8f9bad;margin-bottom:4px}
    .publish-date-box .value{font-weight:700;font-size:.95rem;color:#7df0b3}
    .publish-date-box .hijri{font-size:.8rem;color:#c4b5fd;margin-top:2px}
  </style>
</head>
<body>
  <div class="box">
    <h1>✍️ Tulis Artikel / Post</h1>
    <p class="hint">URL: <code>mastaxul.my/blog/nama-tajuk</code> · Multi gambar ImgBB · Video · Turnstile</p>

    <label>Password admin *</label>
    <input type="password" id="password" autocomplete="current-password">

    <div class="publish-date-box">
      <div class="label">Tarikh & masa siaran (Kuala Lumpur)</div>
      <div class="value" id="publishDateNow">—</div>
      <div class="hijri" id="publishHijriNow">—</div>
    </div>

    <label>Tajuk *</label>
    <input type="text" id="title" placeholder="Tajuk artikel">

    <label>Slug (kosong = auto)</label>
    <input type="text" id="slug" placeholder="nama-tajuk-auto">

    <label>Excerpt / ringkasan</label>
    <input type="text" id="excerpt" placeholder="1–2 ayat">

    <label>Gambar (multi) — upload ImgBB *</label>
    <p class="hint">Boleh pilih banyak fail sekali. Gambar pertama = cover. Diselit automatik antara perenggan di laman.</p>
    <div class="upload-row">
      <input type="file" id="imageFiles" accept="image/*" multiple>
      <button type="button" class="secondary" id="btnUploadImages" style="width:auto;margin:0;padding:10px 14px">Upload semua</button>
    </div>
    <div class="preview-grid" id="imagePreviews"></div>
    <input type="hidden" id="imagesJson" value="[]">
    <label>Cover URL (auto dari gambar pertama, boleh ubah)</label>
    <input type="url" id="cover" placeholder="https://i.ibb.co/...">

    <label>Video (satu URL sebaris — YouTube disyorkan)</label>
    <textarea id="videos" style="min-height:80px" placeholder="https://youtu.be/xxxxx"></textarea>

    <label>Status</label>
    <select id="status">
      <option value="published">Published</option>
      <option value="draft">Draft</option>
    </select>

    <label>Isi artikel *</label>
    <textarea id="body" placeholder="Tulis perenggan. Gambar akan diselit antara perenggan secara automatik."></textarea>

    <div class="turnstile-wrap"><div id="turnstile-form"></div></div>
    <button type="button" id="btnPublish">Simpan ke Google Docs + Sheet</button>
    <div class="msg" id="msg"></div>
    <p class="hint" id="resultLink"></p>
  </div>

<script>
const BLOG_API = "https://script.google.com/macros/s/AKfycbyx_ovUg3Nuw6N49nve0zdToASgP3F-cTQClP0cIshCrvdWWcLox5IXtk55FfnVmRAG/exec";
const TURNSTILE_SITEKEY = "0x4AAAAAAFWrdcXMTCekaOTS";
const TURNSTILE_VERIFY_URL = "https://mastaxul-captcha.2ulfpv.workers.dev/verify";

let tsId = null;
let uploadedImages = [];

function renderTS(){
  if (!window.turnstile) return setTimeout(renderTS, 200);
  if (tsId !== null) return;
  try {
    tsId = turnstile.render("#turnstile-form", { sitekey: TURNSTILE_SITEKEY, theme: "dark" });
  } catch(e){}
}
renderTS();

function getTS(){
  if (!window.turnstile || tsId===null) return "";
  try { return turnstile.getResponse(tsId)||""; } catch(_){ return ""; }
}
function resetTS(){
  if (window.turnstile && tsId!==null) try{ turnstile.reset(tsId); }catch(_){}
}

async function verifyTurnstileServer(token){
  if (!TURNSTILE_VERIFY_URL) return { success: !!token };
  const r = await fetch(TURNSTILE_VERIFY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token })
  });
  const d = await r.json().catch(() => ({}));
  return { success: d.success === true };
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function refreshImageUI(){
  document.getElementById("imagesJson").value = JSON.stringify(uploadedImages);
  const box = document.getElementById("imagePreviews");
  box.innerHTML = uploadedImages.map(u => `<img src="${u}" alt="">`).join("");
  if (uploadedImages.length && !document.getElementById("cover").value.trim()) {
    document.getElementById("cover").value = uploadedImages[0];
  }
}

document.getElementById("btnUploadImages").onclick = async () => {
  const msg = document.getElementById("msg");
  const files = document.getElementById("imageFiles").files;
  const pass = document.getElementById("password").value.trim();
  if (!files.length) { msg.className="msg err"; msg.textContent="Pilih sekurang-kurangnya 1 gambar."; return; }
  if (!pass) { msg.className="msg err"; msg.textContent="Isi password admin dulu."; return; }

  msg.className="msg ok"; msg.textContent="Uploading " + files.length + " gambar…";
  for (let i = 0; i < files.length; i++) {
    try {
      const b64 = await fileToBase64(files[i]);
      const r = await fetch(BLOG_API, {
        method: "POST",
        body: JSON.stringify({ password: pass, action: "upload", image: b64, name: files[i].name })
      });
      const d = await r.json();
      if (d.ok && d.url) {
        uploadedImages.push(d.url);
        refreshImageUI();
        msg.textContent = "Upload " + (i+1) + "/" + files.length + " OK";
      } else {
        msg.className="msg err";
        msg.textContent = (d.message || "Gagal") + " pada fail " + files[i].name;
        return;
      }
    } catch (e) {
      msg.className="msg err"; msg.textContent="Ralat upload: " + files[i].name;
      return;
    }
  }
  msg.className="msg ok";
  msg.textContent = uploadedImages.length + " gambar berjaya. Cover = gambar pertama.";
};

function updatePublishDateBox(){
  try{
    const now = new Date();
    const tz = "Asia/Kuala_Lumpur";
    const el = document.getElementById("publishDateNow");
    const elH = document.getElementById("publishHijriNow");
    if (el) {
      el.textContent =
        now.toLocaleDateString("ms-MY", { timeZone: tz, weekday: "long", day: "numeric", month: "long", year: "numeric" }) +
        " · " +
        now.toLocaleTimeString("ms-MY", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }
    if (elH) {
      elH.textContent = new Intl.DateTimeFormat("ms-MY-u-ca-islamic", {
        timeZone: tz, weekday: "long", day: "numeric", month: "long", year: "numeric"
      }).format(now) + " H";
    }
  }catch(e){}
}
updatePublishDateBox();
setInterval(updatePublishDateBox, 1000);

document.getElementById("btnPublish").onclick = async () => {
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btnPublish");
  const token = getTS();
  if (!token) { msg.className="msg err"; msg.textContent="Lengkapkan CAPTCHA dahulu."; return; }

  btn.disabled = true;
  btn.textContent = "Mengesahkan CAPTCHA…";
  try {
    const v = await verifyTurnstileServer(token);
    if (!v.success) {
      msg.className="msg err"; msg.textContent="CAPTCHA ditolak.";
      resetTS(); btn.disabled=false; btn.textContent="Simpan ke Google Docs + Sheet"; return;
    }
  } catch {
    msg.className="msg err"; msg.textContent="Gagal verify Turnstile.";
    resetTS(); btn.disabled=false; btn.textContent="Simpan ke Google Docs + Sheet"; return;
  }

  const imgs = uploadedImages.length ? uploadedImages : (() => {
    try { return JSON.parse(document.getElementById("imagesJson").value || "[]"); } catch { return []; }
  })();

  let cover = document.getElementById("cover").value.trim();
  if (!cover && imgs.length) cover = imgs[0];

  const payload = {
    password: document.getElementById("password").value.trim(),
    action: "create",
    title: document.getElementById("title").value.trim(),
    slug: document.getElementById("slug").value.trim(),
    excerpt: document.getElementById("excerpt").value.trim(),
    cover,
    images: imgs,
    status: document.getElementById("status").value,
    body: document.getElementById("body").value,
    videos: document.getElementById("videos").value
  };

  if (!payload.password || !payload.title || !payload.body.trim()) {
    msg.className="msg err"; msg.textContent="Password, tajuk dan isi wajib.";
    btn.disabled=false; btn.textContent="Simpan ke Google Docs + Sheet"; return;
  }

  btn.textContent = "Menyimpan…";
  try {
    const r = await fetch(BLOG_API, { method: "POST", body: JSON.stringify(payload) });
    const d = await r.json();
    if (d.ok) {
      msg.className="msg ok";
      msg.textContent = d.message + " · /blog/" + d.slug;
      const full = d.fullUrl || ("https://www.mastaxul.my/blog/" + d.slug);
      document.getElementById("resultLink").innerHTML =
        'Buka: <a href="'+full+'" target="_blank">'+full+'</a>';
      resetTS();
    } else {
      msg.className="msg err"; msg.textContent=d.message||"Gagal"; resetTS();
    }
  } catch {
    msg.className="msg err"; msg.textContent="Ralat rangkaian."; resetTS();
  }
  btn.disabled=false; btn.textContent="Simpan ke Google Docs + Sheet";
};
</script>
</body>
</html>
