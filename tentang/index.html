<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test R2 Upload</title>
  <style>
    body{font-family:system-ui;background:#0b0f19;color:#eee;padding:20px;max-width:420px;margin:auto}
    input,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}
    button{background:#38bdf8;color:#000;font-weight:700;border:none}
    pre{background:#111;padding:12px;border-radius:10px;overflow:auto;font-size:12px;white-space:pre-wrap}
    img{max-width:100%;margin-top:12px;border-radius:10px}
  </style>
</head>
<body>
  <h2>Test upload R2</h2>
  <label>Password Worker</label>
  <input type="password" id="pass" placeholder="UPLOAD_PASSWORD">
  <label>Folder</label>
  <input type="text" id="folder" value="produk">
  <label>Gambar</label>
  <input type="file" id="file" accept="image/*">
  <button type="button" id="btn">Upload</button>
  <pre id="out">—</pre>
  <img id="preview" alt="">

<script>
document.getElementById("btn").onclick = async () => {
  const out = document.getElementById("out");
  const preview = document.getElementById("preview");
  const file = document.getElementById("file").files[0];
  const pass = document.getElementById("pass").value.trim();
  const folder = document.getElementById("folder").value.trim() || "produk";
  if (!file) { out.textContent = "Pilih gambar dulu"; return; }
  if (!pass) { out.textContent = "Isi password"; return; }

  out.textContent = "Uploading…";
  preview.removeAttribute("src");

  const fd = new FormData();
  fd.append("password", pass);
  fd.append("folder", folder);
  fd.append("image", file, file.name);

  try {
    const r = await fetch("https://mastaxul-media-upload.2ulfpv.workers.dev/", {
      method: "POST",
      body: fd
    });
    const d = await r.json();
    out.textContent = JSON.stringify(d, null, 2);
    if (d.url) preview.src = d.url;
  } catch (e) {
    out.textContent = "Ralat: " + e.message;
  }
};
</script>
</body>
</html>
